<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dino Pinball</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;
    background:radial-gradient(ellipse at 50% -10%,#2a1b3a 0%,#120e1a 55%,#050408 100%);
    color:#d8f3c0;font-family:"Trebuchet MS",Verdana,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;padding:14px;}
  #fit{transform-origin:top center;}
  .cab{width:648px;padding:14px;
    background:linear-gradient(180deg,#242835 0%,#171a23 55%,#101219 100%);
    border:5px solid #07080c;border-radius:26px 26px 12px 12px;
    box-shadow:0 34px 80px rgba(0,0,0,.8), inset 0 0 0 3px #333a4b;}
  .marquee{text-align:center;padding:9px 0 11px;border:4px solid #07080c;border-radius:13px;
    background:linear-gradient(180deg,#ffe07a 0%,#ffc043 42%,#e8862f 74%,#c05a1c 100%);
    box-shadow:inset 0 0 26px rgba(255,255,255,.5),0 0 30px rgba(255,175,60,.35);}
  .marquee b{display:block;font-size:35px;letter-spacing:9px;color:#3a1a06;
    text-shadow:0 2px 0 #ffeeb4,0 -1px 0 #a04d12;}
  .marquee i{display:block;font-style:normal;font-size:10px;letter-spacing:6px;color:#6b3410;margin-top:2px;}
  #glass{display:block;width:100%;margin-top:12px;border:4px solid #07080c;border-radius:11px;background:#140b1c;
    box-shadow:0 0 26px rgba(255,140,60,.22);}
  .bezel{margin-top:12px;padding:10px 10px 8px;background:#06080a;border:4px solid #07080c;border-radius:14px;
    box-shadow:inset 0 0 46px rgba(0,0,0,.95);}
  #hud{display:flex;gap:24px;align-items:center;justify-content:center;font-size:16px;letter-spacing:2px;}
  #hud b{color:#ffd24a;font-size:22px;}
  #mult.hot{color:#ff8b3d;text-shadow:0 0 12px #ff8b3d;}
  #dino span{font-size:23px;font-weight:bold;color:#2f4f36;margin:0 3px;}
  #dino span.on{color:#ffd24a;text-shadow:0 0 10px #ffd24a;}
  canvas#c{display:block;margin:8px auto 0;border:3px solid #3c5c40;border-radius:14px;background:#14301c;}
  #msg{height:18px;margin-top:6px;text-align:center;font-size:12px;color:#8fbf7a;letter-spacing:1px;}
  .panel{margin-top:12px;padding:10px 14px;border:4px solid #07080c;border-radius:11px;
    background:linear-gradient(180deg,#333949 0%,#1c2029 100%);
    display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .keys{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:1px;color:#9fb0c2;}
  .keys b{display:inline-block;min-width:20px;text-align:center;background:#0b0e14;border:2px solid #46516500;
    border-color:#465165;border-radius:5px;padding:1px 6px;color:#ffd24a;margin-right:6px;}
  .coin{display:flex;gap:9px;align-items:center;}
  .slot{width:25px;height:40px;background:#0b0e14;border:2px solid #465165;border-radius:4px;position:relative;}
  .slot::after{content:'';position:absolute;left:50%;top:7px;margin-left:-2px;width:4px;height:23px;background:#000;border-radius:2px;}
  .grille{width:74px;height:40px;border:2px solid #465165;border-radius:5px;
    background:repeating-linear-gradient(180deg,#0b0e14 0 3px,#2d3444 3px 6px);}
</style>
</head>
<body>
<div id="fit">
<div class="cab">

  <div class="marquee"><b>DINO PINBALL</b><i>JURASSIC RAIL &amp; CHOMP</i></div>
  <canvas id="glass" width="600" height="180"></canvas>

  <div class="bezel">
    <div id="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>X<b id="mult">1</b></span>
      <span id="dino"><span>D</span><span>I</span><span>N</span><span>O</span></span>
      <span>BALLS <b id="balls">3</b></span>
    </div>
    <canvas id="c" width="560" height="800"></canvas>
    <div id="msg"></div>
  </div>

  <div class="panel">
    <div class="grille"></div>
    <div class="keys">
      <span><b>&#9664;</b><b>&#9654;</b> FLIPPERS</span>
      <span><b>&#9660;</b> HOLD TO CHARGE / RELEASE TO SHOOT</span>
    </div>
    <div class="coin"><div class="slot"></div><div class="slot"></div></div>
  </div>

</div>
</div>

<script>
window.onerror=function(m,s,l){ document.getElementById('msg').textContent='ERROR line '+l+': '+m; };

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);     this.arcTo(x,y,x+w,y,r);
    this.closePath(); return this;
  };
}

const W=560,H=800, CX=280, CY=284;
const RIN=168, ROUT=224, RMID=196;      // ball rail
const CMID=152, CBAND=22, CARR=11;      // car rail: separate track, inside the board
const BR=9, G=0.23;

const scoreEl=document.getElementById('score'),
      ballsEl=document.getElementById('balls'),
      multEl=document.getElementById('mult'),
      msgEl=document.getElementById('msg'),
      dinoEls=document.getElementById('dino').children;

let score=0, balls=3, over=false, mult=1, multTimer=0;
let phase='play', initials='', justIdx=-1;
function loadHi(){ try{ const r=JSON.parse(localStorage.getItem('dinoPinballHi')); if(Array.isArray(r)) return r; }catch(e){} return []; }
function saveHi(){ try{ localStorage.setItem('dinoPinballHi',JSON.stringify(hi)); }catch(e){} }
let hi=loadHi();
let lit=[false,false,false,false], litPulse=[0,0,0,0];
const LETTERS=[{c:'D',x:120,y:360},{c:'I',x:195,y:360},{c:'N',x:310,y:360},{c:'O',x:385,y:360}];
const MOUTH={x:280,y:262,r:19}, MW=32, MH=21;
const HEAD={cx:280,cy:227,rx:80,ry:65};
// skull traced as a segment chain, with a bite taken out at the bottom for the jaw
const HEADSEGS=(function(){
  const out=[], N=48, pts=[];
  for(let i=0;i<=N;i++){
    const th=i/N*Math.PI*2;
    pts.push({x:HEAD.cx+HEAD.rx*Math.cos(th), y:HEAD.cy+HEAD.ry*Math.sin(th), th:th});
  }
  for(let i=0;i<N;i++){
    const deg=((pts[i].th+pts[i+1].th)/2)*180/Math.PI;
    if(deg>64 && deg<116) continue;          // mouth opening, facing straight down
    out.push([pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y]);
  }
  return out;
})();
let scoop=0, flash=0, shake=0, jawT=0, carCool=0, clickCool=0, laneStuck=0;

const ball={x:476,y:770,vx:0,vy:0,r:BR,inLane:true};
const trail=[];
let charge=0, charging=false, launched=false;

const flL={px:172,py:690,len:68,rest:0.5,         up:-0.5,        a:0.5,         w:0, on:false};
const flR={px:332,py:690,len:68,rest:Math.PI-0.5, up:Math.PI+0.5, a:Math.PI-0.5, w:0, on:false};

let carT=0; const carSpeed=0.013;

const SEGS=[
  [56,284,  56,560],
  [56,560,  172,690],
  [448,284, 448,780],
  [448,560, 332,690],
  [504,284, 504,780],
  [448,780, 504,780]
];

const BUMPERS=[
  {x:120,y:480,r:24,cool:0,hit:0},
  {x:384,y:480,r:24,cool:0,hit:0}
];

const EB={x:252,y:586,r:16,lit:false,hit:0,pulse:0};

const pops=[], parts=[];

/* ---------------- sound ---------------- */
let actx=null;
function A(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function blip(f,dur,type,vol,slide){
  const a=A(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.05,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}

/* ---------------- juice ---------------- */
function pop(x,y,t,col){ pops.push({x:x,y:y,t:t,c:col||'#ffd24a',life:52}); }
function burst(x,y,n,col,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=spd*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:22+Math.random()*18,c:col});
  }
}
function kick(n){ shake=Math.min(16,shake+n); }

/* ---------------- physics ----------------
   Contacts are gathered, sorted deepest-first, then resolved sequentially.
   Only the deepest contact gets restitution; the rest merely un-penetrate.
   That stops the corner double-bounce without letting the ball sink or stick. */
let contacts=[];
function contact(nx,ny,pen,e,svx,svy){ contacts.push({nx:nx,ny:ny,pen:pen,e:e,svx:svx||0,svy:svy||0}); }

function segContact(b,x1,y1,x2,y2,rad,e){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2; t=t<0?0:t>1?1:t;
  const px=x1+t*dx, py=y1+t*dy;
  let nx=b.x-px, ny=b.y-py; const d=Math.hypot(nx,ny);
  if(d>=rad) return;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  contact(nx,ny,rad-d,e,0,0);
}
function circContact(b,cx,cy,rad,e,svx,svy){
  let nx=b.x-cx, ny=b.y-cy; const d=Math.hypot(nx,ny), R=rad+b.r;
  if(d>=R) return false;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  contact(nx,ny,R-d,e,svx,svy); return true;
}
function arcContact(b,rad,inside,e){
  const dx=b.x-CX, dy=b.y-CY; if(dy>0) return;
  const d=Math.hypot(dx,dy); if(d===0) return;
  const nx=dx/d, ny=dy/d;
  if(inside){ if(d<=rad-b.r) return; contact(-nx,-ny,d-(rad-b.r),e,0,0); }
  else      { if(d>=rad+b.r) return; contact(nx,ny,(rad+b.r)-d,e,0,0); }
}
function flipperTip(f){ return {x:f.px+Math.cos(f.a)*f.len, y:f.py+Math.sin(f.a)*f.len}; }

function flipperContact(b,f){
  const dx=Math.cos(f.a)*f.len, dy=Math.sin(f.a)*f.len, l2=dx*dx+dy*dy;
  let t=((b.x-f.px)*dx+(b.y-f.py)*dy)/l2; t=t<0?0:t>1?1:t;
  const px=f.px+t*dx, py=f.py+t*dy;
  let nx=b.x-px, ny=b.y-py; const d=Math.hypot(nx,ny), rad=b.r+7;
  if(d>=rad) return;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  // the flipper only drives the ball on the side it is sweeping toward,
  // so a ball touching the underside is never slammed down into the drain
  const K=0.85, drive = (ny<0) ? K : 0;
  contact(nx,ny,rad-d,0.25, -f.w*(py-f.py)*drive, f.w*(px-f.px)*drive);
}

function resolve(b){
  if(!contacts.length) return 0;
  contacts.sort(function(a,c){ return c.pen-a.pen; });
  let impact=0;
  for(let i=0;i<contacts.length;i++){
    const c=contacts[i];
    b.x += c.nx*c.pen; b.y += c.ny*c.pen;
    const e = i===0 ? c.e : 0;
    let rvx=b.vx-c.svx, rvy=b.vy-c.svy;
    const vn=rvx*c.nx+rvy*c.ny;
    if(vn<0){
      if(i===0) impact=-vn;
      rvx-=(1+e)*vn*c.nx; rvy-=(1+e)*vn*c.ny;
      const tx=-c.ny, ty=c.nx, vt=rvx*tx+rvy*ty;
      rvx-=vt*0.0015*tx; rvy-=vt*0.0015*ty;
      b.vx=rvx+c.svx; b.vy=rvy+c.svy;
    }
  }
  return impact;
}

/* ---------------- mouth ---------------- */
function jawOpen(){
  const p=jawT%290;
  if(p<125) return 1;                        // open
  if(p<135) return 1-(p-125)/10;             // snap shut
  if(p<280) return 0;                        // clamped
  return Math.min(1,(p-280)/10);             // snap open
}

/* ---------------- game ---------------- */
function award(n,x,y,label){
  const total=n*mult;
  score+=total; scoreEl.textContent=score;
  pop(x,y,(label?label+' ':'')+'+'+total);
  mult=Math.min(9,mult+1); multTimer=150;
  multEl.textContent=mult; multEl.className = mult>3?'hot':'';
}
function paintLetters(){ for(let i=0;i<4;i++) dinoEls[i].className = lit[i]?'on':''; }

function newBall(){
  ball.x=476; ball.y=770; ball.vx=0; ball.vy=0; ball.inLane=true;
  charge=0; charging=false; launched=false; scoop=0; laneStuck=0; trail.length=0;
  mult=1; multEl.textContent=1; multEl.className='';
}
function loseBall(){
  balls--; ballsEl.textContent=Math.max(balls,0);
  blip(220,0.45,'sawtooth',0.07,60); kick(10);
  burst(ball.x,ball.y,18,'#9aa3ad',3);
  if(balls<=0) gameOver();
  else newBall();
}
function launch(){
  if(launched) return;
  ball.vy=-(21+7*charge);
  launched=true; charging=false; charge=0;
  blip(150,0.18,'square',0.07,520); kick(3);
}
function reset(){
  score=0; balls=3; over=false; lit=[false,false,false,false];
  scoreEl.textContent=0; ballsEl.textContent=3;
  pops.length=0; parts.length=0; EB.lit=false; EB.hit=0; phase='play'; justIdx=-1; initials='';
  paintLetters(); newBall(); msgEl.textContent=HINT;
}

function gameOver(){
  over=true; justIdx=-1;
  if(score>0 && (hi.length<5 || score>hi[hi.length-1].s)){
    phase='entry'; initials='';
    msgEl.textContent='NEW HIGH SCORE - TYPE 3 INITIALS, THEN ENTER';
    blip(520,0.5,'square',0.07,1200);
  }else{
    phase='scores';
    msgEl.textContent='PRESS R TO PLAY AGAIN';
  }
}
function commitScore(){
  let name=initials.length?initials:'AAA';
  while(name.length<3) name+='-';
  const rec={n:name,s:score};
  hi.push(rec);
  hi.sort(function(a,b){ return b.s-a.s; });
  hi=hi.slice(0,5);
  justIdx=hi.indexOf(rec);
  saveHi();
  phase='scores';
  msgEl.textContent='PRESS R TO PLAY AGAIN';
  blip(880,0.2,'square',0.07,1600);
}

const HINT='HOLD DOWN-ARROW TO CHARGE, RELEASE TO SHOOT  -  LEFT/RIGHT = FLIPPERS';

addEventListener('keydown',function(e){
  if(phase==='entry'){
    if(e.key==='Enter'){ commitScore(); }
    else if(e.key==='Backspace'){ initials=initials.slice(0,-1); e.preventDefault(); }
    else if(/^[a-zA-Z0-9]$/.test(e.key) && initials.length<3){
      initials+=e.key.toUpperCase(); blip(700,0.04,'square',0.04);
    }
    return;
  }
  if(phase==='scores'){
    if(e.key==='r'||e.key==='R') reset();
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault();
  if(e.key==='ArrowLeft'  && !flL.on){ flL.on=true; blip(90,0.05,'square',0.04); }
  if(e.key==='ArrowRight' && !flR.on){ flR.on=true; blip(90,0.05,'square',0.04); }
  if(e.key==='ArrowDown' && !launched) charging=true;
});
addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')  flL.on=false;
  if(e.key==='ArrowRight') flR.on=false;
  if(e.key==='ArrowDown' && charging) launch();
});

function step(){
  jawT++; carT+=carSpeed; if(carT>Math.PI+0.3) carT=-0.3;
  if(shake>0) shake*=0.86;
  if(flash>0) flash--;
  if(carCool>0) carCool--;
  if(clickCool>0) clickCool--;
  for(let i=0;i<4;i++) if(litPulse[i]>0) litPulse[i]--;
  for(const bp of BUMPERS){ if(bp.cool>0) bp.cool--; if(bp.hit>0) bp.hit--; }
  if(EB.hit>0) EB.hit--;
  EB.pulse+=0.09;

  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.y-=0.75; p.life--; if(p.life<=0) pops.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }

  if(multTimer>0){ multTimer--; if(multTimer===0){ mult=1; multEl.textContent=1; multEl.className=''; } }

  // per-frame flipper angular velocity (applied in slices inside the substeps)
  const FSPD=0.36;
  for(const f of [flL,flR]){
    const diff=(f.on?f.up:f.rest)-f.a;
    f.w = Math.abs(diff)<FSPD ? diff : (diff>0?FSPD:-FSPD);
  }

  if(over){ for(const f of [flL,flR]) f.a+=f.w; return; }

  if(scoop>0){
    for(const f of [flL,flR]) f.a+=f.w;
    scoop--;
    if(scoop===0){
      ball.x=MOUTH.x; ball.y=MOUTH.y+46;
      ball.vx=(Math.random()-0.5)*3; ball.vy=4.5;
      blip(700,0.14,'square',0.06,300);
    }
    return;
  }

  if(!launched){
    for(const f of [flL,flR]) f.a+=f.w;
    if(charging) charge=Math.min(1,charge+0.022);
    ball.x=476; ball.y=770+charge*22; ball.vx=0; ball.vy=0;
    return;
  }

  trail.push({x:ball.x,y:ball.y});
  if(trail.length>13) trail.shift();

  const N=10, open=jawOpen();
  for(let s=0;s<N;s++){
    // flipper sweeps in slices too, so it can never jump across the ball
    for(const f of [flL,flR]) f.a += f.w/N;

    ball.vy += G/N;
    ball.x += ball.vx/N;
    ball.y += ball.vy/N;

    const d=Math.hypot(ball.x-CX, ball.y-CY);
    if(d > RIN+ball.r+1) ball.inLane=true;
    else if(d < RIN-ball.r-1) ball.inLane=false;

    // flingers: always fire the ball back out at speed
    for(const bp of BUMPERS){
      let nx=ball.x-bp.x, ny=ball.y-bp.y;
      const dd=Math.hypot(nx,ny), R=bp.r+ball.r;
      if(dd<R && dd>0){
        nx/=dd; ny/=dd;
        ball.x=bp.x+nx*R; ball.y=bp.y+ny*R;
        const bsp=Math.hypot(ball.vx,ball.vy);
        ball.vx=nx*(bsp*0.35+6); ball.vy=ny*(bsp*0.35+6);
        if(bp.cool===0){
          bp.cool=10; bp.hit=15;
          award(250,bp.x,bp.y-34,'FLING');
          burst(bp.x,bp.y,13,'#9ef2b0',3.4); kick(5); flash=6;
          blip(660,0.08,'square',0.05,1150);
        }
      }
    }

    contacts.length=0;
    for(const g of SEGS) segContact(ball,g[0],g[1],g[2],g[3],ball.r,0.62);
    arcContact(ball,RIN,!ball.inLane,0.62);
    if(ball.inLane) arcContact(ball,ROUT,true,0.62);
    if(!ball.inLane){
      // the car is solid on its own rail
      const cx=CX+CMID*Math.cos(carT), cy=CY-CMID*Math.sin(carT);
      const cvx=-CMID*Math.sin(carT)*carSpeed, cvy=-CMID*Math.cos(carT)*carSpeed;
      if(circContact(ball,cx,cy,CARR,0.7,cvx,cvy) && carCool===0){
        carCool=18; award(500,cx,cy,'CAR');
        burst(cx,cy,14,'#ffb347',3.2); kick(6); flash=8;
        blip(520,0.1,'square',0.06,880);
      }
      // the skull itself is solid
      for(const g of HEADSEGS) segContact(ball,g[0],g[1],g[2],g[3],ball.r,0.55);
      // jaw shut = the opening is plugged too
      if(open<0.45) circContact(ball,MOUTH.x,MOUTH.y,26,0.62,0,0);
    }
    flipperContact(ball,flL);
    flipperContact(ball,flR);

    const imp=resolve(ball);
    if(imp>5 && clickCool===0){
      clickCool=5;
      blip(180+Math.min(imp,20)*14,0.045,'triangle',Math.min(0.05,imp/500));
      if(imp>11){ burst(ball.x,ball.y,4,'#cfe8bf',1.8); kick(imp*0.16); }
    }
  }

  ball.vx*=0.9995; ball.vy*=0.9995;
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>28){ ball.vx*=28/sp; ball.vy*=28/sp; }

  const hx=(ball.x-HEAD.cx)/HEAD.rx, hy=(ball.y-HEAD.cy)/HEAD.ry;
  if(hx*hx+hy*hy < 1){
    award(5000,MOUTH.x,MOUTH.y-30,'CHOMP');
    scoop=70; flash=18; kick(13);
    burst(MOUTH.x,MOUTH.y,26,'#ff5d3d',4);
    blip(320,0.3,'sawtooth',0.09,90);
  }

  for(let i=0;i<4;i++){
    const L=LETTERS[i];
    if(!lit[i] && Math.hypot(ball.x-L.x,ball.y-L.y)<19){
      lit[i]=true; litPulse[i]=22; paintLetters();
      award(1000,L.x,L.y-24);
      burst(L.x,L.y,10,'#ffd24a',2.4); kick(3);
      blip(440+i*110,0.12,'square',0.06);
      if(lit[0]&&lit[1]&&lit[2]&&lit[3]){
        award(10000,280,400,'D-I-N-O');
        flash=26; kick(16);
        burst(280,400,40,'#ffd24a',5);
        blip(300,0.5,'square',0.09,1400);
        lit=[false,false,false,false];
        if(!EB.lit){ EB.lit=true; pop(EB.x,EB.y-30,'EXTRA BALL LIT!','#7ef2a0'); }
        setTimeout(paintLetters,420);
      }
    }
  }

  if(EB.lit && Math.hypot(ball.x-EB.x,ball.y-EB.y)<EB.r+ball.r){
    EB.lit=false; EB.hit=40;
    balls++; ballsEl.textContent=balls;
    pop(EB.x,EB.y-34,'EXTRA BALL!','#7ef2a0');
    burst(EB.x,EB.y,34,'#7ef2a0',4.5); kick(14); flash=24;
    blip(400,0.45,'square',0.09,1700);
  }

  // rolled back down the entry ramp: the lane kicker fires it out again
  if(ball.x>452 && ball.y>660 && Math.hypot(ball.vx,ball.vy)<1.4){
    if(++laneStuck>36){
      laneStuck=0; ball.vx=0; ball.vy=-23;
      blip(140,0.2,'square',0.07,560); kick(4);
      pop(476,700,'KICK!');
    }
  } else laneStuck=0;

  if(ball.y>H+20 || (ball.y>785 && ball.x<444)) loseBall();
}

}

function drawDino(){
  const open=jawOpen(), mh=3+open*(MH-3);
  ctx.save();

  ctx.fillStyle='#356b38';
  ctx.beginPath();
  ctx.moveTo(232,272); ctx.lineTo(328,272); ctx.lineTo(318,312); ctx.lineTo(242,312);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle='#2a5530';
  const spikes=[[238,180,8],[259,168,9],[280,162,10],[301,168,9],[322,180,8]];
  for(const s of spikes){
    ctx.beginPath();
    ctx.moveTo(s[0]-s[2],s[1]+13); ctx.lineTo(s[0],s[1]-s[2]); ctx.lineTo(s[0]+s[2],s[1]+13);
    ctx.closePath(); ctx.fill();
  }

  const g=ctx.createLinearGradient(0,160,0,295);
  g.addColorStop(0,'#7cc569'); g.addColorStop(0.55,'#4f9a4b'); g.addColorStop(1,'#33702f');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(200,236);
  ctx.bezierCurveTo(200,182, 238,162, 280,162);
  ctx.bezierCurveTo(322,162, 360,182, 360,236);
  ctx.bezierCurveTo(360,272, 330,292, 280,292);
  ctx.bezierCurveTo(230,292, 200,272, 200,236);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#25522a'; ctx.lineWidth=3; ctx.stroke();

  ctx.fillStyle='#25522a';
  ctx.beginPath(); ctx.moveTo(208,196); ctx.lineTo(266,188); ctx.lineTo(264,202); ctx.lineTo(210,210); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(352,196); ctx.lineTo(294,188); ctx.lineTo(296,202); ctx.lineTo(350,210); ctx.closePath(); ctx.fill();

  for(const ex of [246,314]){
    ctx.fillStyle='#ffdc4a'; ctx.beginPath(); ctx.ellipse(ex,214,14,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#101010'; ctx.beginPath(); ctx.ellipse(ex,214,4,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(ex-5,210,2.6,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#25522a';
  ctx.beginPath(); ctx.ellipse(268,238,4,5.5,0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(292,238,4,5.5,-0.4,0,Math.PI*2); ctx.fill();

  // mouth cavity, height driven by the jaw cycle
  ctx.fillStyle = scoop>0 ? '#ffd24a' : '#180a0a';
  ctx.beginPath(); ctx.ellipse(MOUTH.x,MOUTH.y,MW,mh,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#25522a'; ctx.lineWidth=2.5; ctx.stroke();
  if(open>0.5){
    ctx.fillStyle='#a5424a';
    ctx.beginPath(); ctx.ellipse(MOUTH.x,MOUTH.y+mh*0.5,15,Math.max(1,mh*0.3),0,0,Math.PI*2); ctx.fill();
  }
  // lower jaw rises as the mouth shuts
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(MOUTH.x-MW-2, MOUTH.y+mh);
  ctx.quadraticCurveTo(MOUTH.x, MOUTH.y+mh+34, MOUTH.x+MW+2, MOUTH.y+mh);
  ctx.lineTo(MOUTH.x+MW+2, MOUTH.y+mh+6);
  ctx.quadraticCurveTo(MOUTH.x, MOUTH.y+mh+40, MOUTH.x-MW-2, MOUTH.y+mh+6);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle='#f4f2e2';
  for(let i=0;i<7;i++){
    const x=MOUTH.x-27+i*9;
    const k=Math.sqrt(Math.max(0,1-Math.pow((x-MOUTH.x)/MW,2)))*mh;
    const h=Math.min(12,4+mh*0.45);
    ctx.beginPath(); ctx.moveTo(x-4.5,MOUTH.y-k); ctx.lineTo(x+4.5,MOUTH.y-k); ctx.lineTo(x,MOUTH.y-k+h); ctx.closePath(); ctx.fill();
  }
  for(let i=0;i<6;i++){
    const x=MOUTH.x-22+i*9;
    const k=Math.sqrt(Math.max(0,1-Math.pow((x-MOUTH.x)/MW,2)))*mh;
    const h=Math.min(11,4+mh*0.42);
    ctx.beginPath(); ctx.moveTo(x-4.5,MOUTH.y+k); ctx.lineTo(x+4.5,MOUTH.y+k); ctx.lineTo(x,MOUTH.y+k-h); ctx.closePath(); ctx.fill();
  }

  ctx.font='bold 11px Verdana'; ctx.textAlign='center';
  if(open>=0.45){ ctx.fillStyle='#ffd24a'; ctx.fillText('MOUTH OPEN - 5000',280,332); }
  else          { ctx.fillStyle='#5f8a5f'; ctx.fillText('JAW SHUT',280,332); }
  ctx.restore();
}

function draw(){

    ctx.fillText(L.c,L.x,L.y+1);
  }
  ctx.textBaseline='alphabetic';

  (function(){
    const on=EB.lit, pl=0.5+0.5*Math.sin(EB.pulse), h=EB.hit/40;

    if(on||h>0){ ctx.shadowColor='#7ef2a0'; ctx.shadowBlur=12+pl*20+h*30; }
    ctx.beginPath(); ctx.arc(EB.x,EB.y,EB.r,0,Math.PI*2);
    ctx.fillStyle= on ? 'rgba(126,242,160,'+(0.55+pl*0.4)+')' : '#20402a';
    ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle= on?'#dfffe9':'#3f7a4a'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle= on?'#0d2a15':'#6ba077';
    ctx.font='bold 13px Verdana'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('EB',EB.x,EB.y+1); ctx.textBaseline='alphabetic';
    ctx.fillStyle= on?'#7ef2a0':'#3f6a49'; ctx.font='bold 9px Verdana';
    ctx.fillText('EXTRA BALL',EB.x,EB.y+30);
    ctx.restore();
  })();

  for(const bp of BUMPERS){
    const h=bp.hit/15;
    ctx.save(); ctx.translate(bp.x,bp.y); ctx.scale(1+h*0.18,1+h*0.18);
    if(h>0){ ctx.shadowColor='#9ef2b0'; ctx.shadowBlur=10+h*26; }
    ctx.fillStyle='#1d4327';
    ctx.beginPath(); ctx.ellipse(0,5,bp.r+3,bp.r+6,0,0,Math.PI*2); ctx.fill();
    const eg=ctx.createRadialGradient(-7,-9,2,0,0,bp.r+4);
    eg.addColorStop(0, h>0?'#ffffff':'#eaf6d8');
    eg.addColorStop(1, h>0?'#9ef2b0':'#b9d99a');
    ctx.fillStyle=eg;
    ctx.beginPath(); ctx.ellipse(0,0,bp.r,bp.r+3,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(90,130,70,0.55)';
    const dots=[[-9,-8,3.4],[6,-11,2.6],[10,2,3.8],[-7,7,3],[1,13,2.4],[-13,3,2.2]];
    for(const dt of dots){ ctx.beginPath(); ctx.ellipse(dt[0],dt[1],dt[2],dt[2]*0.8,0,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle= h>0?'#ffffff':'#7fae6a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,bp.r,bp.r+3,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  ctx.strokeStyle='#6fae72'; ctx.lineWidth=5; ctx.lineCap='round';
  for(const g of SEGS){ ctx.beginPath(); ctx.moveTo(g[0],g[1]); ctx.lineTo(g[2],g[3]); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(CX,CY,RIN,Math.PI,2*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,ROUT,Math.PI,2*Math.PI); ctx.stroke();

  for(const f of [flL,flR]){
    const tip=flipperTip(f);
    ctx.strokeStyle='#ffd24a'; ctx.lineWidth=15; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.strokeStyle='#fff0b8'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.fillStyle='#7a5a10'; ctx.beginPath(); ctx.arc(f.px,f.py,5,0,Math.PI*2); ctx.fill();
  }

  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/34);
    ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  if(launched && scoop===0 && !over){
    for(let i=0;i<trail.length;i++){
      const t=trail[i], a=i/trail.length;
      ctx.globalAlpha=a*0.4;
      ctx.fillStyle='#bcd8e8';
      ctx.beginPath(); ctx.arc(t.x,t.y,ball.r*a*0.85,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(scoop===0 && !over){
    const gr=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#93a0ab');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  }

  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.life/26);
    ctx.fillStyle=p.c; ctx.font='bold 16px Verdana'; ctx.textAlign='center';
    ctx.fillText(p.t,p.x,p.y);
  }
  ctx.globalAlpha=1;

  if(!launched && !over){
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=11; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(476,ball.y+10); ctx.lineTo(476,800); ctx.stroke();
    ctx.fillStyle='#0d1b12'; ctx.fillRect(516,640,12,120);
    ctx.fillStyle='#ffd24a'; ctx.fillRect(516,760-charge*120,12,charge*120);
    ctx.strokeStyle='#6fae72'; ctx.lineWidth=1.5; ctx.strokeRect(516,640,12,120);
  }

  if(flash>0){ ctx.fillStyle='rgba(255,210,74,'+(flash/90)+')'; ctx.fillRect(-20,-20,W+40,H+40); }
  if(over) drawScoreScreen();
  ctx.restore();
}

/* ---------------- backglass: spinosaurus chasing a car ---------------- */
const gl=document.getElementById('glass'), gx=gl.getContext('2d');
const GW=600, GH=180, HORIZON=134;
let glassT=0; const gdust=[];

function spino(x,y,sc,step){
  gx.save(); gx.translate(x,y); gx.scale(sc,sc);
  // sail membrane
  gx.fillStyle='#2b0f24';
  gx.beginPath();
  gx.moveTo(8,-24);
  gx.bezierCurveTo(14,-86, 46,-108, 78,-96);
  gx.bezierCurveTo(104,-84, 112,-46, 106,-20);
  gx.closePath(); gx.fill();
  gx.strokeStyle='#150713'; gx.lineWidth=2;
  for(let i=1;i<6;i++){
    const t=i/6;
    gx.beginPath(); gx.moveTo(8+t*98,-22);
    gx.lineTo(20+t*80,-96+Math.abs(t-0.5)*54); gx.stroke();
  }
  // body, head, tail
  gx.fillStyle='#150713';
  gx.beginPath();
  gx.moveTo(-96,-44);                              // snout tip
  gx.lineTo(-52,-54);
  gx.quadraticCurveTo(-30,-60,-16,-52);            // skull
  gx.quadraticCurveTo(-4,-44, 6,-30);              // neck
  gx.bezierCurveTo(30,-34, 74,-32, 104,-18);       // back under the sail
  gx.quadraticCurveTo(140,-4, 178,14);             // tail
  gx.quadraticCurveTo(140,-14, 112,-6);            // tail underside
  gx.lineTo(92,-2);
  gx.lineTo(96+step*7,26); gx.lineTo(80+step*7,26); gx.lineTo(76,-2);   // back leg
  gx.quadraticCurveTo(46,10, 22,4);                // belly
  gx.lineTo(28-step*7,26); gx.lineTo(12-step*7,26); gx.lineTo(10,2);    // front leg
  gx.quadraticCurveTo(-14,-8,-30,-24);             // throat
  gx.quadraticCurveTo(-62,-32,-96,-38);            // lower jaw
  gx.closePath(); gx.fill();
  // teeth + eye
  gx.fillStyle='#f6e6c8';
  for(let i=0;i<7;i++){
    const tx=-92+i*10, ty=-46+i*1.1;
    gx.beginPath(); gx.moveTo(tx,ty); gx.lineTo(tx+4,ty); gx.lineTo(tx+2,ty+6); gx.closePath(); gx.fill();
  }
  gx.fillStyle='#ffcf3d';
  gx.beginPath(); gx.ellipse(-34,-52,4.5,3.2,-0.2,0,Math.PI*2); gx.fill();
  gx.fillStyle='#150713';
  gx.beginPath(); gx.ellipse(-34,-52,1.7,3,0,0,Math.PI*2); gx.fill();
  gx.restore();
}

function jeep(x,y,sc,bob){
  gx.save(); gx.translate(x,y+bob); gx.scale(sc,sc);
  gx.fillStyle='#150713';
  gx.beginPath();
  gx.moveTo(-46,4); gx.lineTo(-46,-8); gx.lineTo(-30,-10);
  gx.lineTo(-22,-26); gx.lineTo(14,-26); gx.lineTo(22,-10);

  gx.beginPath(); gx.moveTo(-20,-24); gx.lineTo(-4,-24); gx.lineTo(-4,-12); gx.lineTo(-24,-12); gx.closePath(); gx.fill();
  gx.fillStyle='#150713';

  gx.fillStyle='#4a3a2a';

  gx.restore();
}

function drawGlass(){
  glassT++;
  const sky=gx.createLinearGradient(0,0,0,HORIZON);
  sky.addColorStop(0,'#1a0d30'); sky.addColorStop(0.34,'#5d2350');
  sky.addColorStop(0.63,'#bc4340'); sky.addColorStop(0.86,'#ef8b3c'); sky.addColorStop(1,'#ffc76f');
  gx.fillStyle=sky; gx.fillRect(0,0,GW,HORIZON+2);

  const sg=gx.createRadialGradient(300,HORIZON-6,4,300,HORIZON-6,88);
  sg.addColorStop(0,'rgba(255,244,200,.95)'); sg.addColorStop(.45,'rgba(255,186,88,.55)');
  sg.addColorStop(1,'rgba(255,110,50,0)');
  gx.fillStyle=sg; gx.beginPath(); gx.arc(300,HORIZON-6,88,0,Math.PI*2); gx.fill();
  gx.fillStyle='#ffe3a4'; gx.beginPath(); gx.arc(300,HORIZON-8,30,0,Math.PI*2); gx.fill();

  // volcano ridge
  gx.fillStyle='#3d1a3c';
  gx.beginPath(); gx.moveTo(0,HORIZON);
  gx.lineTo(46,104); gx.lineTo(96,124); gx.lineTo(150,86); gx.lineTo(178,100);
  gx.lineTo(214,118); gx.lineTo(268,96); gx.lineTo(310,120); gx.lineTo(372,82);
  gx.lineTo(404,104); gx.lineTo(452,116); gx.lineTo(512,92); gx.lineTo(560,118);
  gx.lineTo(GW,102); gx.lineTo(GW,HORIZON+2); gx.lineTo(0,HORIZON+2);
  gx.closePath(); gx.fill();
  gx.fillStyle='rgba(255,120,60,0.5)';
  gx.beginPath(); gx.moveTo(366,84); gx.lineTo(372,80); gx.lineTo(380,88); gx.lineTo(374,92); gx.closePath(); gx.fill();
  gx.save(); gx.globalAlpha=0.28; gx.fillStyle='#c8b0c8';
  for(let i=0;i<4;i++){
    const yy=76-i*15, xx=374+Math.sin((glassT*0.011)+i)*9;
    gx.beginPath(); gx.arc(xx,yy,5+i*3.2,0,Math.PI*2); gx.fill();
  }
  gx.restore();

  // palms
  gx.fillStyle='#1d0a1e';
  for(const px of [30,566]){
    gx.save(); gx.translate(px,HORIZON+4);
    gx.beginPath(); gx.moveTo(-3,0); gx.quadraticCurveTo(-6,-40,-12,-68);
    gx.lineTo(-4,-68); gx.quadraticCurveTo(1,-40,3,0); gx.closePath(); gx.fill();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i-2)*0.55;
      gx.beginPath(); gx.moveTo(-8,-68);
      gx.quadraticCurveTo(-8+Math.cos(a)*26,-68+Math.sin(a)*22,-8+Math.cos(a)*44,-64+Math.sin(a)*20);
      gx.quadraticCurveTo(-8+Math.cos(a)*24,-62+Math.sin(a)*16,-8,-64); gx.closePath(); gx.fill();
    }
    gx.restore();
  }

  // ground
  const gg=gx.createLinearGradient(0,HORIZON,0,GH);
  gg.addColorStop(0,'#6b3520'); gg.addColorStop(1,'#25100e');
  gx.fillStyle=gg; gx.fillRect(0,HORIZON,GW,GH-HORIZON);
  gx.strokeStyle='rgba(255,170,90,0.18)'; gx.lineWidth=1;
  for(let i=0;i<7;i++){
    const yy=HORIZON+5+i*6;
    gx.beginPath(); gx.moveTo(0,yy); gx.lineTo(GW,yy); gx.stroke();
  }

  // dust
  if(glassT%3===0){
    gdust.push({x:196+Math.random()*14,y:HORIZON+14+Math.random()*8,r:3+Math.random()*5,life:64});
    if(glassT%9===0) gdust.push({x:392+Math.random()*20,y:HORIZON+16+Math.random()*8,r:4+Math.random()*7,life:56});
  }
  for(let i=gdust.length-1;i>=0;i--){
    const d=gdust[i]; d.x+=0.7; d.y-=0.18; d.r+=0.16; d.life--;
    if(d.life<=0){ gdust.splice(i,1); continue; }
    gx.globalAlpha=(d.life/64)*0.42;
    gx.fillStyle='#e9b98a';
    gx.beginPath(); gx.arc(d.x,d.y,d.r,0,Math.PI*2); gx.fill();
  }
  gx.globalAlpha=1;

  const bob=Math.sin(glassT*0.16)*1.4;
  const stride=Math.sin(glassT*0.15);
  jeep(168,HORIZON+18,1,bob);
  spino(392,HORIZON+16,1,stride);

  // speed lines
  gx.strokeStyle='rgba(255,215,150,0.22)'; gx.lineWidth=2;
  for(let i=0;i<5;i++){
    const yy=HORIZON-14-i*13, off=(glassT*3+i*47)%180;
    gx.beginPath(); gx.moveTo(500-off,yy); gx.lineTo(560-off,yy); gx.stroke();
  }

  // glass sheen + vignette
  const sh=gx.createLinearGradient(0,0,GW,GH);
  sh.addColorStop(0,'rgba(255,255,255,0.10)'); sh.addColorStop(0.42,'rgba(255,255,255,0)');
  gx.fillStyle=sh; gx.fillRect(0,0,GW,GH);
  const vg=gx.createRadialGradient(GW/2,GH/2,GH*0.35,GW/2,GH/2,GW*0.62);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  gx.fillStyle=vg; gx.fillRect(0,0,GW,GH);
}

function fitCab(){
  const f=document.getElementById('fit');
  f.style.transform='none';
  const sc=Math.min(1,(window.innerHeight-28)/f.offsetHeight);
  f.style.transform='scale('+sc+')';
}
addEventListener('resize',fitCab);

function loop(){ step(); draw(); drawGlass(); requestAnimationFrame(loop); }
msgEl.textContent=HINT;
paintLetters();
fitCab();
loop();
</script>
</body>
</html>
