<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dino Pinball</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;
    background:radial-gradient(ellipse at 50% -10%,#2a1b3a 0%,#120e1a 55%,#050408 100%);
    color:#d8f3c0;font-family:"Trebuchet MS",Verdana,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;padding:14px;}
  #fit{transform-origin:top center;}
  .cab{width:1090px;padding:15px;
    background:linear-gradient(180deg,#242835 0%,#171a23 55%,#101219 100%);
    border:5px solid #07080c;border-radius:28px 28px 12px 12px;
    box-shadow:0 34px 80px rgba(0,0,0,.8), inset 0 0 0 3px #333a4b;}
  .marquee{text-align:center;padding:10px 0 12px;border:4px solid #07080c;border-radius:13px;
    background:linear-gradient(180deg,#ffe07a 0%,#ffc043 42%,#e8862f 74%,#c05a1c 100%);
    box-shadow:inset 0 0 26px rgba(255,255,255,.5),0 0 30px rgba(255,175,60,.35);}
  .marquee b{display:block;font-size:46px;letter-spacing:14px;color:#3a1a06;
    text-shadow:0 2px 0 #ffeeb4,0 -1px 0 #a04d12;}
  .marquee i{display:block;font-style:normal;font-size:11px;letter-spacing:8px;color:#6b3410;margin-top:2px;}
  #glass{display:block;width:100%;margin-top:12px;border:4px solid #07080c;border-radius:11px;background:#140b1c;
    box-shadow:0 0 26px rgba(255,140,60,.22);}
  .bezel{margin-top:12px;padding:10px 10px 8px;background:#06080a;border:4px solid #07080c;border-radius:14px;
    box-shadow:inset 0 0 46px rgba(0,0,0,.95);}
  #hud{display:flex;gap:32px;align-items:center;justify-content:center;font-size:16px;letter-spacing:2px;}
  #hud b{color:#ffd24a;font-size:22px;}
  #mult.hot{color:#ff8b3d;text-shadow:0 0 12px #ff8b3d;}
  #dino span{font-size:19px;font-weight:bold;color:#2f4f36;margin:0 2px;}
  #dino span.on{color:#ffd24a;text-shadow:0 0 10px #ffd24a;}
  canvas#c{display:block;margin:8px auto 0;border:3px solid #3c5c40;border-radius:14px;background:#14301c;}
  #msg{height:18px;margin-top:6px;text-align:center;font-size:12px;color:#8fbf7a;letter-spacing:1px;}
  .panel{margin-top:12px;padding:10px 16px;border:4px solid #07080c;border-radius:11px;
    background:linear-gradient(180deg,#333949 0%,#1c2029 100%);
    display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .keys{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:1px;color:#9fb0c2;}
  .keys b{display:inline-block;min-width:20px;text-align:center;background:#0b0e14;
    border:2px solid #465165;border-radius:5px;padding:1px 6px;color:#ffd24a;margin-right:6px;}
  .coin{display:flex;gap:9px;align-items:center;}
  #clear{font-family:inherit;font-size:10px;letter-spacing:1px;color:#e2a0a0;cursor:pointer;
    background:#160e12;border:2px solid #6b3a3a;border-radius:6px;padding:7px 11px;}
  #clear:hover{background:#2a1418;border-color:#a35050;color:#ffd3d3;}
  #clear:active{transform:translateY(1px);}
  #clear.done{color:#9ef2b0;border-color:#3f7a4a;background:#0f2416;}
  .slot{width:25px;height:40px;background:#0b0e14;border:2px solid #465165;border-radius:4px;position:relative;}
  .slot::after{content:'';position:absolute;left:50%;top:7px;margin-left:-2px;width:4px;height:23px;background:#000;border-radius:2px;}
  .grille{width:90px;height:40px;border:2px solid #465165;border-radius:5px;
    background:repeating-linear-gradient(180deg,#0b0e14 0 3px,#2d3444 3px 6px);}
  /* short windows: give the vertical room to the playfield */
  .cab.compact{padding:9px;}
  .cab.compact #glass{display:none;}
  .cab.compact .marquee{padding:4px 0 6px;}
  .cab.compact .marquee b{font-size:28px;letter-spacing:9px;}
  .cab.compact .marquee i{display:none;}
  .cab.compact .bezel{margin-top:8px;padding:7px 7px 5px;}
  .cab.compact #hud{font-size:14px;gap:22px;}
  .cab.compact #hud b{font-size:19px;}
  .cab.compact #msg{height:14px;margin-top:3px;font-size:11px;}
  .cab.compact .panel{margin-top:8px;padding:5px 12px;}
  .cab.compact .grille,.cab.compact .slot{height:26px;}
  .cab.compact #clear{padding:5px 9px;}
</style>
</head>
<body>
<div id="fit">
<div class="cab">

  <div class="marquee"><b>DINO PINBALL</b><i>JURASSIC RAIL &amp; CHOMP</i></div>
  <canvas id="glass" width="1000" height="190"></canvas>

  <div class="bezel">
    <div id="hud">
      <span>SCORE <b id="score">0</b></span>
      <span>X<b id="mult">1</b></span>
      <span id="dino"><span>D</span><span>I</span><span>N</span><span>O</span><span>S</span><span>A</span><span>U</span><span>R</span></span>
      <span>BALLS <b id="balls">3</b></span>
    </div>
    <canvas id="c" width="1000" height="1000"></canvas>
    <div id="msg"></div>
  </div>

  <div class="panel">
    <div class="grille"></div>
    <div class="keys">
      <span><b>&#9664;</b><b>&#9654;</b> FLIPPERS</span>
      <span><b>&#9660;</b> HOLD TO CHARGE / RELEASE TO SHOOT</span>
    </div>
    <button id="clear" type="button">CLEAR HIGH SCORES</button>
    <div class="coin"><div class="slot"></div><div class="slot"></div></div>
  </div>

</div>
</div>

<script>
window.onerror=function(m,s,l){ document.getElementById('msg').textContent='ERROR line '+l+': '+m; };

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
if(!ctx.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);     this.arcTo(x,y,x+w,y,r);
    this.closePath(); return this;
  };
}

const W=1000, H=1000;
// the rail is an ELLIPSE, so the table can be wide without the dome eating all the height
const EX=500, EY=330;
const RX_O=470, RY_O=280, RX_I=414, RY_I=224;
const RX_M=(RX_O+RX_I)/2, RY_M=(RY_O+RY_I)/2;
const RX_C=360, RY_C=170, CARR=14;          // the car's own track
const BR=11, G=0.23;

const LANE_L=914, LANE_R=970, LANE_X=942, FLOOR=980;
const EXIT_L=30, EXIT_R=86;

const scoreEl=document.getElementById('score'),
      ballsEl=document.getElementById('balls'),
      multEl=document.getElementById('mult'),
      msgEl=document.getElementById('msg'),
      dinoEls=document.getElementById('dino').children;

let score=0, balls=3, over=false, mult=1, multTimer=0;
let phase='play', initials='', justIdx=-1;
function loadHi(){ try{ const r=JSON.parse(localStorage.getItem('dinoPinballHi')); if(Array.isArray(r)) return r; }catch(e){} return []; }
function saveHi(){ try{ localStorage.setItem('dinoPinballHi',JSON.stringify(hi)); }catch(e){} }
let hi=loadHi();

const WORD='DINOSAUR', NL=WORD.length;
function noLetters(){ const a=[]; for(let i=0;i<NL;i++) a.push(false); return a; }
let lit=noLetters(), litPulse=[0,0,0,0,0,0,0,0];
const LETTERS=(function(){
  const out=[], x0=148, x1=796;
  for(let i=0;i<NL;i++) out.push({c:WORD[i], x:x0+(x1-x0)*i/(NL-1), y:450});
  return out;
})();

const HEAD={cx:500,cy:280,rx:95,ry:100};
const MOUTH={x:500,y:344,r:28}, MW=34, MH=26;

/* segment chains, with a cheap midpoint reject so the long ones stay fast */
function chain(cx,cy,rx,ry,a0,a1,N,skipLo,skipHi){
  const segs=[], pts=[];
  for(let i=0;i<=N;i++){
    const th=a0+(i/N)*(a1-a0);
    pts.push([cx+rx*Math.cos(th), cy+ry*Math.sin(th), th]);
  }
  for(let i=0;i<N;i++){
    const a=pts[i], b=pts[i+1];
    if(skipHi!==undefined){
      let deg=((a[2]+b[2])/2)*180/Math.PI; deg=((deg%360)+360)%360;
      if(deg>skipLo && deg<skipHi) continue;
    }
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    const hl=Math.hypot(b[0]-a[0],b[1]-a[1])/2+BR+4;
    segs.push([a[0],a[1],b[0],b[1],mx,my,hl*hl]);
  }
  return segs;
}
const RAIL_IN =chain(EX,EY,RX_I,RY_I,Math.PI,2*Math.PI,130);
const RAIL_OUT=chain(EX,EY,RX_O,RY_O,Math.PI,2*Math.PI,130);
const HEADSEGS=chain(HEAD.cx,HEAD.cy,HEAD.rx,HEAD.ry,0,2*Math.PI,64,72,108);

let scoop=0, ejectRail=false, flash=0, shake=0, jawT=0, carCool=0, clickCool=0, laneStuck=0;
let railPhase=0, railGlow=0, doorOpen=0, stuckT=0;

const ball={x:LANE_X,y:790,vx:0,vy:0,r:BR,inLane:true};
const trail=[];
let charge=0, charging=false, launched=false;

const flL ={px:380,py:880,len:80,rest:0.5,         up:-0.5,        a:0.5,         w:0, on:false};
const flR ={px:564,py:880,len:80,rest:Math.PI-0.5, up:Math.PI+0.5, a:Math.PI-0.5, w:0, on:false};
const flL2={px:160,py:560,len:58,rest:0.5,         up:-0.5,        a:0.5,         w:0, on:false};
const flR2={px:784,py:560,len:58,rest:Math.PI-0.5, up:Math.PI+0.5, a:Math.PI-0.5, w:0, on:false};
const FLIPPERS=[flL,flR,flL2,flR2];

let carT=0; const carSpeed=0.011;

const SEGS=[
  [EXIT_L,EY,   EXIT_L,500],
  [EXIT_L,500,  380,880],
  [LANE_L,EY,   LANE_L,FLOOR],
  [LANE_L,500,  564,880],
  [LANE_R,EY,   LANE_R,FLOOR],
  [LANE_L,FLOOR, LANE_R,FLOOR],
  [64,469,  414,849],          // left habitrail inner wall
  [880,469, 530,849]           // right habitrail inner wall
];

// mouth at the top, delivery just above the flipper
const HR=[
  {mx:48,  my:469, ex:414, ey:849, cool:0, glow:0},
  {mx:896, my:469, ex:530, ey:849, cool:0, glow:0}
];

const BUMPERS=[{x:280,y:670,r:28,cool:0,hit:0},{x:664,y:670,r:28,cool:0,hit:0}];
const EBS=(function(){
  const out=[];
  for(const t of [Math.PI*0.75, Math.PI*0.25]){        // on the car's own track
    out.push({x:EX+RX_C*Math.cos(t), y:EY-RY_C*Math.sin(t),
              r:18, lit:false, hit:0, pulse:out.length*1.6});
  }
  return out;
})();
const pops=[], parts=[];

/* ---------------- sound ---------------- */
let actx=null;
function A(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function blip(f,dur,type,vol,slide){
  const a=A(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.05,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
function pop(x,y,t,col){ pops.push({x:x,y:y,t:t,c:col||'#ffd24a',life:52}); }
function burst(x,y,n,col,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=spd*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:22+Math.random()*18,c:col});
  }
}
function kick(n){ shake=Math.min(16,shake+n); }

/* ---------------- physics ---------------- */
let contacts=[];
function contact(nx,ny,pen,e,svx,svy){ contacts.push({nx:nx,ny:ny,pen:pen,e:e,svx:svx||0,svy:svy||0}); }
function segContact(b,x1,y1,x2,y2,rad,e){
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2; t=t<0?0:t>1?1:t;
  const px=x1+t*dx, py=y1+t*dy;
  let nx=b.x-px, ny=b.y-py; const d=Math.hypot(nx,ny);
  if(d>=rad) return;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  contact(nx,ny,rad-d,e,0,0);
}
function chainContact(segs,b,e){
  for(const g of segs){
    const dx=b.x-g[4], dy=b.y-g[5];
    if(dx*dx+dy*dy>g[6]) continue;
    segContact(b,g[0],g[1],g[2],g[3],b.r,e);
  }
}
function circContact(b,cx,cy,rad,e,svx,svy){
  let nx=b.x-cx, ny=b.y-cy; const d=Math.hypot(nx,ny), R=rad+b.r;
  if(d>=R) return false;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  contact(nx,ny,R-d,e,svx,svy); return true;
}
function flipperTip(f){ return {x:f.px+Math.cos(f.a)*f.len, y:f.py+Math.sin(f.a)*f.len}; }
function flipperContact(b,f){
  const dx=Math.cos(f.a)*f.len, dy=Math.sin(f.a)*f.len, l2=dx*dx+dy*dy;
  let t=((b.x-f.px)*dx+(b.y-f.py)*dy)/l2; t=t<0?0:t>1?1:t;
  const px=f.px+t*dx, py=f.py+t*dy;
  let nx=b.x-px, ny=b.y-py; const d=Math.hypot(nx,ny), rad=b.r+7;
  if(d>=rad) return;
  if(d===0){nx=0;ny=-1;}else{nx/=d;ny/=d;}
  const K=1.05, drive=(ny<0)?K:0;
  contact(nx,ny,rad-d,0.25, -f.w*(py-f.py)*drive, f.w*(px-f.px)*drive);
}
function resolve(b){
  if(!contacts.length) return 0;
  contacts.sort(function(a,c){ return c.pen-a.pen; });
  let impact=0;
  for(let i=0;i<contacts.length;i++){
    const c=contacts[i];
    b.x+=c.nx*c.pen; b.y+=c.ny*c.pen;
    const e=i===0?c.e:0;
    let rvx=b.vx-c.svx, rvy=b.vy-c.svy;
    const vn=rvx*c.nx+rvy*c.ny;
    if(vn<0){
      if(i===0) impact=-vn;
      rvx-=(1+e)*vn*c.nx; rvy-=(1+e)*vn*c.ny;
      const tx=-c.ny, ty=c.nx, vt=rvx*tx+rvy*ty;
      rvx-=vt*0.0015*tx; rvy-=vt*0.0015*ty;
      b.vx=rvx+c.svx; b.vy=rvy+c.svy;
    }
  }
  return impact;
}
function jawOpen(){
  const p=jawT%290;
  if(p<125) return 1;
  if(p<135) return 1-(p-125)/10;
  if(p<280) return 0;
  return Math.min(1,(p-280)/10);
}
function carPos(){ return {x:EX+RX_C*Math.cos(carT), y:EY-RY_C*Math.sin(carT)}; }
function carVel(){ return {x:-RX_C*Math.sin(carT)*carSpeed, y:-RY_C*Math.cos(carT)*carSpeed}; }

/* ---------------- game ---------------- */
function award(n,x,y,label){
  const total=n*mult;
  score+=total; scoreEl.textContent=score;
  pop(x,y,(label?label+' ':'')+'+'+total);
  mult=Math.min(9,mult+1); multTimer=150;
  multEl.textContent=mult; multEl.className=mult>3?'hot':'';
}
function paintLetters(){ for(let i=0;i<NL;i++) dinoEls[i].className=lit[i]?'on':''; }
function newBall(){
  ball.x=LANE_X; ball.y=FLOOR-BR-23; ball.vx=0; ball.vy=0; ball.inLane=true;
  charge=0; charging=false; launched=false; scoop=0; ejectRail=false; laneStuck=0; stuckT=0; trail.length=0;
  mult=1; multEl.textContent=1; multEl.className='';
}
function gameOver(){
  over=true; justIdx=-1;
  if(score>0 && (hi.length<5 || score>hi[hi.length-1].s)){
    phase='entry'; initials='';
    msgEl.textContent='NEW HIGH SCORE - TYPE 3 INITIALS, THEN ENTER';
    blip(520,0.5,'square',0.07,1200);
  }else{ phase='scores'; msgEl.textContent='PRESS R TO PLAY AGAIN'; }
}
function commitScore(){
  let name=initials.length?initials:'AAA';
  while(name.length<3) name+='-';
  const rec={n:name,s:score};
  hi.push(rec); hi.sort(function(a,b){return b.s-a.s;}); hi=hi.slice(0,5);
  justIdx=hi.indexOf(rec); saveHi();
  phase='scores'; msgEl.textContent='PRESS R TO PLAY AGAIN';
  blip(880,0.2,'square',0.07,1600);
}
function loseBall(){
  balls--; ballsEl.textContent=Math.max(balls,0);
  blip(220,0.45,'sawtooth',0.07,60); kick(10);
  burst(ball.x,ball.y,18,'#9aa3ad',3);
  if(balls<=0) gameOver(); else newBall();
}
function launch(){
  if(launched) return;
  ball.vy=-(22+6*charge);
  launched=true; charging=false; charge=0;
  blip(150,0.18,'square',0.07,520); kick(3);
}
function reset(){
  score=0; balls=3; over=false; lit=noLetters();
  scoreEl.textContent=0; ballsEl.textContent=3;
  pops.length=0; parts.length=0;
  for(const e of EBS){ e.lit=false; e.hit=0; }
  phase='play'; justIdx=-1; initials='';
  paintLetters(); newBall(); msgEl.textContent=HINT;
}
const HINT='HOLD DOWN-ARROW TO CHARGE, RELEASE TO SHOOT  -  LEFT/RIGHT = FLIPPERS';

addEventListener('keydown',function(e){
  if(phase==='entry'){
    if(e.key==='Enter') commitScore();
    else if(e.key==='Backspace'){ initials=initials.slice(0,-1); e.preventDefault(); }
    else if(/^[a-zA-Z0-9]$/.test(e.key) && initials.length<3){ initials+=e.key.toUpperCase(); blip(700,0.04,'square',0.04); }
    return;
  }
  if(phase==='scores'){ if(e.key==='r'||e.key==='R') reset(); return; }
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault();
  if(e.key==='ArrowLeft'  && !flL.on){ flL.on=true; flL2.on=true; blip(90,0.05,'square',0.04); }
  if(e.key==='ArrowRight' && !flR.on){ flR.on=true; flR2.on=true; blip(90,0.05,'square',0.04); }
  if(e.key==='ArrowDown' && !launched) charging=true;
});
addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'){  flL.on=false; flL2.on=false; }
  if(e.key==='ArrowRight'){ flR.on=false; flR2.on=false; }
  if(e.key==='ArrowDown' && charging) launch();
});

function step(){
  jawT++; carT+=carSpeed; if(carT>Math.PI+0.3) carT=-0.3;
  railPhase=(railPhase+0.009)%1;
  if(shake>0) shake*=0.86;
  if(flash>0) flash--;
  if(carCool>0) carCool--;
  if(clickCool>0) clickCool--;
  if(railGlow>0) railGlow--;
  if(doorOpen>0) doorOpen-=0.06;
  for(let i=0;i<NL;i++) if(litPulse[i]>0) litPulse[i]--;
  for(const bp of BUMPERS){ if(bp.cool>0) bp.cool--; if(bp.hit>0) bp.hit--; }
  for(const e of EBS){ if(e.hit>0) e.hit--; e.pulse+=0.09; }

  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.y-=0.75; p.life--; if(p.life<=0) pops.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }
  if(multTimer>0){ multTimer--; if(multTimer===0){ mult=1; multEl.textContent=1; multEl.className=''; } }

  const FSPD=0.21;
  for(const f of FLIPPERS){
    const diff=(f.on?f.up:f.rest)-f.a;
    f.w=Math.abs(diff)<FSPD?diff:(diff>0?FSPD:-FSPD);
  }
  if(over){ for(const f of FLIPPERS) f.a+=f.w; return; }

  if(scoop>0){
    for(const f of FLIPPERS) f.a+=f.w;
    scoop--;
    if(scoop===0){
      if(ejectRail){
        // drop it into the rail at the right-hand entry, running up and over the top
        const t=0.14;
        ball.x=EX+RX_M*Math.cos(t); ball.y=EY-RY_M*Math.sin(t);
        let vx=-RX_M*Math.sin(t), vy=-RY_M*Math.cos(t);
        const l=Math.hypot(vx,vy)||1;
        ball.vx=vx/l*21; ball.vy=vy/l*21;
        ball.inLane=true; ejectRail=false;
        trail.length=0; railGlow=40; flash=14; kick(8);
        pop(ball.x-70,ball.y-26,'RAIL RIDE!','#8fe8ff');
        burst(ball.x,ball.y,20,'#8fe8ff',3.5);
        blip(220,0.4,'square',0.08,1500);
      }else{
        ball.x=MOUTH.x; ball.y=HEAD.cy+HEAD.ry+18;
        ball.vx=(Math.random()-0.5)*3; ball.vy=4.5;
        blip(700,0.14,'square',0.06,300);
      }
    }
    return;
  }
  if(!launched){
    for(const f of FLIPPERS) f.a+=f.w;
    if(charging) charge=Math.min(1,charge+0.022);
    ball.x=LANE_X; ball.y=FLOOR-BR-23+charge*23; ball.vx=0; ball.vy=0;
    return;
  }

  trail.push({x:ball.x,y:ball.y});
  if(trail.length>15) trail.shift();

  // rail assist: a gentle shove around the loop, not a rocket
  if(ball.inLane && ball.y<EY){
    const th=Math.atan2((ball.y-EY)/RY_I,(ball.x-EX)/RX_I);
    let tx=-RX_I*Math.sin(th), ty=RY_I*Math.cos(th);
    const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    const dir=(ball.vx*tx+ball.vy*ty)>=0?1:-1;
    ball.vx+=tx*dir*0.04; ball.vy+=ty*dir*0.04;
    railGlow=14;
    if(jawT%3===0) parts.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:16,c:'#8fe8ff'});
  }

  const N=10, open=jawOpen();
  for(let s=0;s<N;s++){
    for(const f of FLIPPERS) f.a+=f.w/N;
    ball.vy+=G/N; ball.x+=ball.vx/N; ball.y+=ball.vy/N;

    const u=Math.pow((ball.x-EX)/RX_I,2)+Math.pow((ball.y-EY)/RY_I,2);
    if(u>1.07) ball.inLane=true; else if(u<0.93) ball.inLane=false;

    for(const bp of BUMPERS){
      let nx=ball.x-bp.x, ny=ball.y-bp.y;
      const dd=Math.hypot(nx,ny), R=bp.r+ball.r;
      if(dd<R && dd>0){
        nx/=dd; ny/=dd;
        ball.x=bp.x+nx*R; ball.y=bp.y+ny*R;
        const bsp=Math.hypot(ball.vx,ball.vy);
        ball.vx=nx*(bsp*0.35+6); ball.vy=ny*(bsp*0.35+6);
        if(bp.cool===0){
          bp.cool=10; bp.hit=15;
          award(250,bp.x,bp.y-36,'FLING');
          burst(bp.x,bp.y,13,'#9ef2b0',3.4); kick(5); flash=6;
          blip(660,0.08,'square',0.05,1150);
        }
      }
    }

    contacts.length=0;
    for(const g of SEGS) segContact(ball,g[0],g[1],g[2],g[3],ball.r,0.62);
    chainContact(RAIL_IN,ball,0.62);
    chainContact(RAIL_OUT,ball,0.62);
    if(ball.vy<0 && ball.x<EXIT_R+12) segContact(ball,EXIT_L,EY,EXIT_R,EY,ball.r,0.30);

    if(!ball.inLane){
      const c=carPos(), cvv=carVel();
      if(circContact(ball,c.x,c.y,CARR,0.7,cvv.x,cvv.y) && carCool===0){
        carCool=18; award(500,c.x,c.y,'CAR');
        burst(c.x,c.y,14,'#ffb347',3.2); kick(6); flash=8;
        blip(520,0.1,'square',0.06,880);
      }
      chainContact(HEADSEGS,ball,0.55);
      if(open<0.45) circContact(ball,MOUTH.x,MOUTH.y,27,0.62,0,0);
    }
    for(const f of FLIPPERS) flipperContact(ball,f);

    const imp=resolve(ball);
    if(imp>5 && clickCool===0){
      clickCool=5;
      blip(180+Math.min(imp,20)*14,0.045,'triangle',Math.min(0.05,imp/500));
      if(imp>11){ burst(ball.x,ball.y,4,'#cfe8bf',1.8); kick(imp*0.16); }
    }
  }

  for(const h of HR){
    if(h.cool>0) h.cool--;
    if(h.glow>0) h.glow--;
    if(h.cool===0 && ball.vy>0 && Math.hypot(ball.x-h.ex,ball.y-h.ey)<34){
      h.cool=90; h.glow=34;
      award(750,h.ex,h.ey-30,'HABITRAIL');
      burst(h.ex,h.ey,12,'#8fe8ff',3); kick(4);
      blip(600,0.14,'triangle',0.06,1200);
    }
  }

  if(ball.x>LANE_L && ball.y>FLOOR-ball.r){
    ball.y=FLOOR-ball.r;
    if(ball.vy>0) ball.vy=0;
  }

  if(ball.y>EY-6 && ball.y<EY+16 && ball.x<EXIT_R+10 && ball.vy>0) doorOpen=1;

  ball.vx*=0.9995; ball.vy*=0.9995;
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>27){ ball.vx*=27/sp; ball.vy*=27/sp; }

  const hx=(ball.x-HEAD.cx)/HEAD.rx, hy=(ball.y-HEAD.cy)/HEAD.ry;
  if(hx*hx+hy*hy<1){
    award(25000,MOUTH.x,MOUTH.y-46,'CHOMP');
    scoop=70; flash=18; kick(13);
    burst(MOUTH.x,MOUTH.y,26,'#ff5d3d',4);
    blip(320,0.3,'sawtooth',0.09,90);
  }

  for(let i=0;i<NL;i++){
    const L=LETTERS[i];
    if(!lit[i] && Math.hypot(ball.x-L.x,ball.y-L.y)<21){
      lit[i]=true; litPulse[i]=22; paintLetters();
      award(400,L.x,L.y-28);
      burst(L.x,L.y,10,'#ffd24a',2.4); kick(3);
      blip(400+i*62,0.12,'square',0.06);
      let all=true; for(let k=0;k<NL;k++) if(!lit[k]) all=false;
      if(all){
        award(6000,EX,540,'DINOSAUR!');
        flash=30; kick(16);
        burst(EX,540,52,'#ffd24a',5.5);
        blip(300,0.6,'square',0.09,1600);
        lit=noLetters();
        let anyNew=false;
        for(const e of EBS) if(!e.lit){ e.lit=true; anyNew=true; }
        if(anyNew) pop(EX,606,'EXTRA BALLS LIT!','#7ef2a0');
        setTimeout(paintLetters,420);
      }
    }
  }

  for(const e of EBS){
    if(e.lit && Math.hypot(ball.x-e.x,ball.y-e.y)<e.r+ball.r){
      e.lit=false; e.hit=40;
      balls++; ballsEl.textContent=balls;
      pop(e.x,e.y-38,'EXTRA BALL!','#7ef2a0');
      burst(e.x,e.y,34,'#7ef2a0',4.5); kick(14); flash=24;
      blip(400,0.45,'square',0.09,1700);
      scoop=42; ejectRail=true;          // ride the rail
      break;
    }
  }

  if(Math.hypot(ball.vx,ball.vy)<1.1 && ball.y<840 && ball.x<LANE_L-4){
    if(++stuckT>100){
      stuckT=0; ball.vx=(Math.random()-0.5)*7; ball.vy=4.5;
      pop(ball.x,ball.y-24,'NUDGE','#bcd8e8'); kick(3);
      blip(200,0.1,'triangle',0.05);
    }
  } else stuckT=0;

  if(ball.x>LANE_L+4 && ball.y>850 && Math.hypot(ball.vx,ball.vy)<1.4){
    if(++laneStuck>36){
      laneStuck=0; ball.vx=0; ball.vy=-25;
      blip(140,0.2,'square',0.07,560); kick(4);
      pop(LANE_X,900,'KICK!');
    }
  } else laneStuck=0;

  if(ball.y>H+20 || (ball.y>985 && ball.x<LANE_L-4)) loseBall();
}

/* ---------------- drawing ---------------- */
function drawRail(){
  ctx.beginPath();
  ctx.ellipse(EX,EY,RX_O,RY_O,0,Math.PI,2*Math.PI);
  ctx.lineTo(EX+RX_I,EY);
  ctx.ellipse(EX,EY,RX_I,RY_I,0,2*Math.PI,Math.PI,true);
  ctx.closePath();
  ctx.fillStyle='#232935'; ctx.fill();

  const hot=railGlow>0;
  const CH=30;
  for(let i=0;i<CH;i++){
    const f=((i/CH)+railPhase)%1;
    const th=Math.PI+f*Math.PI;
    const x=EX+RX_M*Math.cos(th), y=EY+RY_M*Math.sin(th);
    const tx=-RX_M*Math.sin(th), ty=RY_M*Math.cos(th);
    const rot=Math.atan2(-ty,-tx);
    const a=0.16+0.5*Math.pow(Math.sin(f*Math.PI),0.6);
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.globalAlpha=hot?Math.min(1,a*1.7):a;
    ctx.strokeStyle=hot?'#bff4ff':'#5ad6ff';
    ctx.lineWidth=hot?4:3; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(-9,-11); ctx.lineTo(7,0); ctx.lineTo(-9,11); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;

  const pulse=0.55+0.45*Math.sin(jawT*0.09);
  ctx.shadowColor='#5ad6ff'; ctx.shadowBlur=hot?26:14;
  ctx.strokeStyle=hot?'#d8f6ff':'rgba(90,214,255,'+(0.45+pulse*0.4)+')';
  ctx.lineWidth=hot?5:3;
  ctx.beginPath(); ctx.ellipse(EX,EY,RX_I,RY_I,0,Math.PI,2*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(EX,EY,RX_O,RY_O,0,Math.PI,2*Math.PI); ctx.stroke();
  ctx.shadowBlur=0;

  for(let i=0;i<=16;i++){
    const th=Math.PI+(i/16)*Math.PI;
    const on=(Math.floor(jawT*0.14)+i)%4===0||hot;
    ctx.fillStyle=on?'#ffe89a':'#2f3948';
    if(on){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=12; }
    ctx.beginPath(); ctx.arc(EX+(RX_O-9)*Math.cos(th),EY+(RY_O-9)*Math.sin(th),3.4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.fillStyle=hot?'#d8f6ff':'#6fd0ec';
  ctx.font='bold 14px Verdana'; ctx.textAlign='center';
  ctx.fillText('J U R A S S I C   R A I L',EX,EY-RY_M+5);
}

function drawDoor(){
  const a=Math.max(0,Math.min(1,doorOpen));
  ctx.save();
  ctx.translate(EXIT_R,EY); ctx.rotate(a*0.95);
  const gr=ctx.createLinearGradient(-56,0,0,0);
  gr.addColorStop(0,'#7d8794'); gr.addColorStop(0.5,'#cdd6df'); gr.addColorStop(1,'#7d8794');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.roundRect(-56,-4,56,8,4); ctx.fill();
  ctx.strokeStyle='#39424e'; ctx.lineWidth=1.5; ctx.stroke();
  for(let i=1;i<4;i++){ ctx.fillStyle='#39424e'; ctx.fillRect(-56+i*13,-3,2,6); }
  ctx.restore();
  ctx.fillStyle='#8e9aa8'; ctx.beginPath(); ctx.arc(EXIT_R,EY,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#39424e'; ctx.beginPath(); ctx.arc(EXIT_R,EY,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6b9a72'; ctx.font='bold 9px Verdana'; ctx.textAlign='center';
  ctx.fillText('ONE WAY',(EXIT_L+EXIT_R)/2,EY+22);
}

function drawCarTrack(){
  ctx.strokeStyle='#2b3038'; ctx.lineWidth=26;
  ctx.beginPath(); ctx.ellipse(EX,EY,RX_C,RY_C,0,Math.PI,2*Math.PI); ctx.stroke();
  ctx.strokeStyle='#808c99'; ctx.lineWidth=2; ctx.setLineDash([7,10]);
  ctx.beginPath(); ctx.ellipse(EX,EY,RX_C,RY_C,0,Math.PI,2*Math.PI); ctx.stroke();
  ctx.setLineDash([]);
}

function drawCar(){
  const c=carPos();
  const tx=-RX_C*Math.sin(carT), ty=-RY_C*Math.cos(carT);
  const tl=Math.hypot(tx,ty)||1;
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(Math.atan2(tx/tl,-ty/tl));
  ctx.fillStyle='#151515';
  ctx.fillRect(-13,-10,8,5); ctx.fillRect(5,-10,8,5);
  ctx.fillRect(-13,5,8,5);   ctx.fillRect(5,5,8,5);
  ctx.fillStyle='#e2543a';
  ctx.beginPath(); ctx.roundRect(-10,-12,20,24,4); ctx.fill();
  ctx.fillStyle='#ffeaa8'; ctx.beginPath(); ctx.roundRect(-6.5,-7,13,9,2); ctx.fill();
  ctx.fillStyle='#b93a25'; ctx.beginPath(); ctx.roundRect(-6.5,4,13,6,2); ctx.fill();
  ctx.fillStyle='#fff6c0'; ctx.fillRect(-7.5,-13.5,4,3); ctx.fillRect(3.5,-13.5,4,3);
  ctx.restore();
}

/* theropod skull, front on: narrow cranium, wide jugals, long muzzle */
function drawDino(){
  const open=jawOpen(), mh=3+open*(MH-3);
  const cx=HEAD.cx, cy=HEAD.cy, T=cy-HEAD.ry, B=cy+HEAD.ry, Lx=cx-HEAD.rx, Rx=cx+HEAD.rx;
  ctx.save();

  ctx.fillStyle='#2f5f34';
  ctx.beginPath(); ctx.moveTo(cx-58,B-26); ctx.lineTo(cx+58,B-26);
  ctx.lineTo(cx+48,B+34); ctx.lineTo(cx-48,B+34); ctx.closePath(); ctx.fill();

  // low osteoderms down the midline, not ears
  ctx.fillStyle='#2b5330';
  for(let i=0;i<4;i++){
    const yy=T+8+i*13, w=7+i*2.2;
    ctx.beginPath(); ctx.ellipse(cx,yy,w,4.6,0,0,Math.PI*2); ctx.fill();
  }

  ctx.beginPath(); ctx.ellipse(cx,cy,HEAD.rx,HEAD.ry,0,0,Math.PI*2);
  const sg=ctx.createLinearGradient(0,T,0,B);
  sg.addColorStop(0,'#5f9a52'); sg.addColorStop(0.42,'#4b8442'); sg.addColorStop(1,'#2d5f2c');
  ctx.fillStyle=sg; ctx.fill();
  ctx.save(); ctx.clip();

  // heavy shadow down both flanks so the muzzle reads as projecting forward
  ctx.fillStyle='rgba(14,38,14,0.55)';
  ctx.beginPath(); ctx.ellipse(Lx+6,cy+30,44,110,0.18,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(Rx-6,cy+30,44,110,-0.18,0,Math.PI*2); ctx.fill();

  // the muzzle itself: a narrow tapering wedge
  const mg=ctx.createLinearGradient(cx-40,0,cx+40,0);
  mg.addColorStop(0,'#4e8a45'); mg.addColorStop(0.5,'#7ab765'); mg.addColorStop(1,'#4e8a45');
  ctx.fillStyle=mg;
  ctx.beginPath();
  ctx.moveTo(cx-44,cy-26); ctx.quadraticCurveTo(cx,cy-40,cx+44,cy-26);
  ctx.lineTo(cx+38,B-6); ctx.quadraticCurveTo(cx,B+8,cx-38,B-6);
  ctx.closePath(); ctx.fill();

  // scale rows
  ctx.globalAlpha=0.14;
  for(let row=0;row<12;row++){
    const yy=T+8+row*16;
    for(let col=0;col<11;col++){
      const xx=Lx+6+col*17+(row%2?8:0);
      ctx.fillStyle=row<4?'#cdf0b4':'#12300d';
      ctx.beginPath(); ctx.ellipse(xx,yy,6,4.2,0,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // antorbital fenestra - the giveaway that this is a theropod skull
  ctx.fillStyle='rgba(10,30,10,0.72)';
  ctx.beginPath(); ctx.ellipse(cx-48,cy+4,15,23,0.22,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+48,cy+4,15,23,-0.22,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle='#1c3f1a'; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.ellipse(cx,cy,HEAD.rx,HEAD.ry,0,0,Math.PI*2); ctx.stroke();

  // bony brow, swept down toward the middle
  ctx.fillStyle='#26491f';
  for(const sgn of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(cx+sgn*84,cy-58);
    ctx.quadraticCurveTo(cx+sgn*52,cy-72,cx+sgn*16,cy-58);
    ctx.lineTo(cx+sgn*18,cy-44);
    ctx.quadraticCurveTo(cx+sgn*50,cy-56,cx+sgn*80,cy-42);
    ctx.closePath(); ctx.fill();
  }

  // small, deep-set reptile eyes out on the sides
  for(const sgn of [-1,1]){
    const ex=cx+sgn*54, ey=cy-40;
    ctx.fillStyle='#0f2a0c';
    ctx.beginPath(); ctx.ellipse(ex,ey,17,13,sgn*0.3,0,Math.PI*2); ctx.fill();
    const eg=ctx.createRadialGradient(ex-3,ey-3,1,ex,ey,12);
    eg.addColorStop(0,'#ffeeb4'); eg.addColorStop(0.5,'#f0a828'); eg.addColorStop(1,'#a35c12');
    ctx.fillStyle=eg;
    ctx.beginPath(); ctx.ellipse(ex,ey,12,8.5,sgn*0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0a0a';
    ctx.beginPath(); ctx.ellipse(ex,ey,2.6,7.5,sgn*0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(ex-4,ey-3,2.2,0,Math.PI*2); ctx.fill();
  }

  // nostrils high on the muzzle
  for(const sgn of [-1,1]){
    ctx.fillStyle='#16360f';
    ctx.beginPath(); ctx.ellipse(cx+sgn*15,cy+18,5,8,sgn*0.35,0,Math.PI*2); ctx.fill();
  }

  // ---- jaws ----
  ctx.fillStyle=scoop>0?'#ffd24a':'#160808';
  ctx.beginPath(); ctx.ellipse(MOUTH.x,MOUTH.y,MW,mh,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1c3f1a'; ctx.lineWidth=3; ctx.stroke();
  if(open>0.5){
    ctx.fillStyle='#8e3540';
    ctx.beginPath(); ctx.ellipse(MOUTH.x,MOUTH.y+mh*0.45,17,Math.max(1,mh*0.34),0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle=sg;
  ctx.beginPath();
  ctx.moveTo(MOUTH.x-MW-3,MOUTH.y+mh);
  ctx.quadraticCurveTo(MOUTH.x,MOUTH.y+mh+34,MOUTH.x+MW+3,MOUTH.y+mh);
  ctx.lineTo(MOUTH.x+MW+3,MOUTH.y+mh+8);
  ctx.quadraticCurveTo(MOUTH.x,MOUTH.y+mh+42,MOUTH.x-MW-3,MOUTH.y+mh+8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#1c3f1a'; ctx.lineWidth=2.5; ctx.stroke();

  ctx.fillStyle='#f6f0da';
  const up=[6,11,9,13,10,12,7];
  for(let i=0;i<up.length;i++){
    const x=MOUTH.x-MW+5+i*((MW*2-10)/(up.length-1));
    const k=Math.sqrt(Math.max(0,1-Math.pow((x-MOUTH.x)/MW,2)))*mh;
    const h=Math.min(up[i]+4,4+mh*0.8);
    ctx.beginPath(); ctx.moveTo(x-4.4,MOUTH.y-k); ctx.lineTo(x+4.4,MOUTH.y-k); ctx.lineTo(x+1,MOUTH.y-k+h); ctx.closePath(); ctx.fill();
  }
  const lo=[5,10,8,12,9,10];
  for(let i=0;i<lo.length;i++){
    const x=MOUTH.x-MW+10+i*((MW*2-20)/(lo.length-1));
    const k=Math.sqrt(Math.max(0,1-Math.pow((x-MOUTH.x)/MW,2)))*mh;
    const h=Math.min(lo[i]+3,4+mh*0.72);
    ctx.beginPath(); ctx.moveTo(x-4,MOUTH.y+k); ctx.lineTo(x+4,MOUTH.y+k); ctx.lineTo(x,MOUTH.y+k-h); ctx.closePath(); ctx.fill();
  }

  ctx.font='bold 12px Verdana'; ctx.textAlign='center';
  if(open>=0.45){ ctx.fillStyle='#ffd24a'; ctx.fillText('MOUTH OPEN - 25000',cx,B+56); }
  else          { ctx.fillStyle='#5f8a5f'; ctx.fillText('JAW SHUT',cx,B+56); }
  ctx.restore();
}

function draw(){
  ctx.save();
  if(shake>0.4) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle='#14301c'; ctx.fillRect(-20,-20,W+40,H+40);

  ctx.fillStyle='#1b3d24';
  ctx.beginPath();
  ctx.moveTo(EXIT_L,EY); ctx.lineTo(EXIT_L,500); ctx.lineTo(380,880);
  ctx.lineTo(564,880); ctx.lineTo(LANE_L,500); ctx.lineTo(LANE_L,EY);
  ctx.ellipse(EX,EY,RX_I,RY_I,0,0,Math.PI,true);
  ctx.fill();

  drawRail();

  ctx.fillStyle='#232935'; ctx.fillRect(LANE_L,EY,56,FLOOR-EY);
  ctx.strokeStyle='#8e9aa8'; ctx.lineWidth=2; ctx.setLineDash([10,12]);
  ctx.beginPath(); ctx.moveTo(LANE_X,EY); ctx.lineTo(LANE_X,FLOOR-6); ctx.stroke();
  ctx.setLineDash([]);

  drawCarTrack();
  drawDino();

  for(const e of EBS){
    const on=e.lit, pl=0.5+0.5*Math.sin(e.pulse), h=e.hit/40;
    ctx.save();
    if(on||h>0){ ctx.shadowColor='#7ef2a0'; ctx.shadowBlur=12+pl*20+h*30; }
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fillStyle=on?'rgba(126,242,160,'+(0.55+pl*0.4)+')':'#20402a';
    ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=on?'#dfffe9':'#3f7a4a'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=on?'#0d2a15':'#6ba077';
    ctx.font='bold 14px Verdana'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('EB',e.x,e.y+1); ctx.textBaseline='alphabetic';
    ctx.fillStyle=on?'#7ef2a0':'#3f6a49'; ctx.font='bold 10px Verdana';
    ctx.fillText('EXTRA BALL',e.x,e.y+34);
    ctx.restore();
  }

  drawCar();

  for(const bp of BUMPERS){
    const h=bp.hit/15;
    ctx.save(); ctx.translate(bp.x,bp.y); ctx.scale(1+h*0.18,1+h*0.18);
    if(h>0){ ctx.shadowColor='#9ef2b0'; ctx.shadowBlur=10+h*26; }
    ctx.fillStyle='#1d4327';
    ctx.beginPath(); ctx.ellipse(0,5,bp.r+3,bp.r+6,0,0,Math.PI*2); ctx.fill();
    const eg=ctx.createRadialGradient(-8,-10,2,0,0,bp.r+4);
    eg.addColorStop(0,h>0?'#ffffff':'#eaf6d8'); eg.addColorStop(1,h>0?'#9ef2b0':'#b9d99a');
    ctx.fillStyle=eg;
    ctx.beginPath(); ctx.ellipse(0,0,bp.r,bp.r+3,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(90,130,70,0.55)';
    for(const dt of [[-10,-9,3.6],[7,-12,2.8],[11,3,4],[-8,8,3.2],[1,15,2.6],[-14,4,2.4]]){
      ctx.beginPath(); ctx.ellipse(dt[0],dt[1],dt[2],dt[2]*0.8,0,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle=h>0?'#ffffff':'#7fae6a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,0,bp.r,bp.r+3,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  for(let i=0;i<NL;i++){
    const L=LETTERS[i], p=litPulse[i]/22, rr=19+p*8;
    if(lit[i]){ ctx.shadowColor='#ffd24a'; ctx.shadowBlur=14+p*20; }
    ctx.beginPath(); ctx.arc(L.x,L.y,rr,0,Math.PI*2);
    ctx.fillStyle=lit[i]?'#ffd24a':'#26512f'; ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=lit[i]?'#fff3c4':'#3f7a4a'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=lit[i]?'#3a2a00':'#7fb98c';
    ctx.font='bold 20px Verdana'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(L.c,L.x,L.y+1);
  }
  ctx.textBaseline='alphabetic';

  // habitrail chutes
  for(let k=0;k<2;k++){
    const h=HR[k], lit=h.glow>0;
    const ox0=(k===0?EXIT_L:LANE_L), oy0=500;
    const ox1=(k===0?380:564),      oy1=880;
    const ix0=(k===0?64:880),  iy0=469;
    const ix1=(k===0?414:530), iy1=849;
    ctx.beginPath();
    ctx.moveTo(ox0,iy0); ctx.lineTo(ox0,oy0); ctx.lineTo(ox1,oy1);
    ctx.lineTo(ix1,iy1); ctx.lineTo(ix0,iy0); ctx.closePath();
    ctx.fillStyle=lit?'rgba(143,232,255,0.20)':'rgba(24,46,66,0.75)'; ctx.fill();
    // cross ties
    ctx.strokeStyle=lit?'rgba(190,244,255,0.75)':'rgba(120,150,175,0.35)'; ctx.lineWidth=2;
    for(let i=1;i<11;i++){
      const t=i/11;
      ctx.beginPath();
      ctx.moveTo(ox0+(ox1-ox0)*t, oy0+(oy1-oy0)*t);
      ctx.lineTo(ix0+(ix1-ix0)*t, iy0+(iy1-iy0)*t);
      ctx.stroke();
    }
    ctx.strokeStyle=lit?'#d8f6ff':'#7f93a8'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ix0,iy0); ctx.lineTo(ix1,iy1); ctx.stroke();
    ctx.fillStyle=lit?'#d8f6ff':'#6f8497';
    ctx.font='bold 10px Verdana'; ctx.textAlign='center';
    ctx.save(); ctx.translate(h.mx,h.my-14); ctx.fillText('RAIL',0,0); ctx.restore();
  }

  ctx.strokeStyle='#6fae72'; ctx.lineWidth=5; ctx.lineCap='round';
  for(const g of SEGS){ ctx.beginPath(); ctx.moveTo(g[0],g[1]); ctx.lineTo(g[2],g[3]); ctx.stroke(); }

  drawDoor();

  for(const f of FLIPPERS){
    const tip=flipperTip(f), big=f.len>70;
    ctx.strokeStyle='#ffd24a'; ctx.lineWidth=big?16:13; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.strokeStyle='#fff0b8'; ctx.lineWidth=big?5:4;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tip.x,tip.y); ctx.stroke();
    ctx.fillStyle='#7a5a10'; ctx.beginPath(); ctx.arc(f.px,f.py,big?5:4,0,Math.PI*2); ctx.fill();
  }

  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/34);
    ctx.fillStyle=p.c; ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;

  if(launched && scoop===0 && !over){
    for(let i=0;i<trail.length;i++){
      const t=trail[i], a=i/trail.length;
      ctx.globalAlpha=a*0.42; ctx.fillStyle='#bcd8e8';
      ctx.beginPath(); ctx.arc(t.x,t.y,ball.r*a*0.85,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(scoop===0 && !over){
    const gr=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#93a0ab');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  }

  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.life/26);
    ctx.fillStyle=p.c; ctx.font='bold 17px Verdana'; ctx.textAlign='center';
    ctx.fillText(p.t,p.x,p.y);
  }
  ctx.globalAlpha=1;

  if(!launched && !over){
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=12; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(LANE_X,ball.y+10); ctx.lineTo(LANE_X,H); ctx.stroke();
    ctx.fillStyle='#0d1b12'; ctx.fillRect(974,820,14,140);
    const cg=ctx.createLinearGradient(0,960,0,820);
    cg.addColorStop(0,'#ffe14a'); cg.addColorStop(0.28,'#ffc22e');
    cg.addColorStop(0.55,'#ff8b1e'); cg.addColorStop(0.8,'#ff5a1c'); cg.addColorStop(1,'#ff2a1e');
    ctx.fillStyle=cg; ctx.fillRect(974,960-charge*140,14,charge*140);
    for(let i=1;i<7;i++){ ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(974,820+i*20,14,1.5); }
    ctx.strokeStyle='#6fae72'; ctx.lineWidth=1.5; ctx.strokeRect(974,820,14,140);
  }

  if(flash>0){ ctx.fillStyle='rgba(255,210,74,'+(flash/90)+')'; ctx.fillRect(-20,-20,W+40,H+40); }
  if(over) drawScoreScreen();
  ctx.restore();
}

function drawScoreScreen(){

  ctx.textAlign='center';
  ctx.fillStyle='#ffd24a'; ctx.font='bold 54px "Trebuchet MS",Verdana';
  ctx.fillText('DINO PINBALL',W/2,170);

  if(phase==='entry'){
    ctx.fillStyle='#ffd24a'; ctx.font='bold 18px Verdana';

    ctx.fillStyle='#8fbf7a'; ctx.font='12px Verdana';
    ctx.fillText('TYPE 3 INITIALS  -  ENTER TO SAVE',W/2,422);

    for(let i=0;i<3;i++){
      const bx=W/2-80+i*80;
      ctx.fillStyle='#17301d'; ctx.fillRect(bx-30,450,60,70);
      ctx.strokeStyle=i===initials.length?'#ffd24a':'#3f7a4a';

      ctx.fillStyle='#ffd24a'; ctx.font='bold 38px Verdana';
      if(i<initials.length) ctx.fillText(initials[i],bx,500);

    }
    return;
  }
  ctx.fillStyle='#8fbf7a'; ctx.font='bold 19px Verdana';
  ctx.fillText('- HIGH SCORES -',W/2,404);
  if(!hi.length){ ctx.fillStyle='#5f8a5f'; ctx.font='14px Verdana'; ctx.fillText('no scores yet',W/2,458); }
  for(let i=0;i<hi.length;i++){

    ctx.fillStyle=on?'#ffd24a':'#9fd18a';

    ctx.textAlign='right'; ctx.fillText(String(hi[i].s),W/2+228,y);
    ctx.textAlign='center';
  }
  ctx.fillStyle='#8fbf7a'; ctx.font='bold 16px Verdana';
  ctx.fillText('PRESS  R  TO PLAY AGAIN',W/2,880);
}

/* ---------------- backglass ---------------- */
const gl=document.getElementById('glass'), gx=gl.getContext('2d');
const GW=1000, GH=190, HORIZON=144;
let glassT=0; const gdust=[];

/* Spinosaurus: tall neural-spine sail, long narrow kinked snout,
   short arms with recurved claws, thick tapering tail. */
function spino(x,y,sc,step){
  gx.save(); gx.translate(x,y); gx.scale(sc,sc);
  const SKIN='#160814', DARK='#0a030a', SAIL='#3a1430', RIM='rgba(255,168,92,0.55)';

  /* ---- tail: long, with the paddle fin of the modern reconstruction ---- */
  gx.fillStyle=SAIL;
  gx.beginPath();
  gx.moveTo(150,-24);
  gx.quadraticCurveTo(190,-64, 228,-42);
  gx.quadraticCurveTo(250,-26, 264,14);
  gx.quadraticCurveTo(234,-12, 198,-13);
  gx.quadraticCurveTo(170,-15, 150,-18);
  gx.closePath(); gx.fill();
  gx.strokeStyle='#1d0a18'; gx.lineWidth=1.3;
  for(let i=1;i<6;i++){
    const t=i/6;
    gx.beginPath();
    gx.moveTo(152+t*90,-22+t*26);
    gx.lineTo(164+t*80,-52-Math.sin(t*Math.PI)*10+t*34);
    gx.stroke();
  }
  gx.fillStyle=SKIN;
  gx.beginPath();
  gx.moveTo(92,-36);
  gx.quadraticCurveTo(158,-30, 216,-10);
  gx.quadraticCurveTo(244,0, 262,16);
  gx.quadraticCurveTo(236,10, 208,3);
  gx.quadraticCurveTo(154,-8, 94,-12);
  gx.closePath(); gx.fill();

  /* ---- sail: peaks over the hips, tapers fore and aft ---- */
  gx.fillStyle=SAIL;
  gx.beginPath();
  gx.moveTo(-16,-44);
  gx.bezierCurveTo(2,-120, 28,-152, 58,-152);
  gx.bezierCurveTo(88,-152, 104,-110, 108,-34);
  gx.closePath(); gx.fill();
  gx.strokeStyle='#200b1b'; gx.lineWidth=1.9;
  for(let i=0;i<11;i++){
    const t=i/10;
    const bx=-14+t*120, h=Math.sin(Math.pow(t,0.82)*Math.PI)*102+14;
    gx.beginPath(); gx.moveTo(bx,-42); gx.lineTo(-8+t*114,-42-h); gx.stroke();
  }
  gx.strokeStyle='#5e2549'; gx.lineWidth=2.6;
  gx.beginPath();
  gx.moveTo(-16,-44); gx.bezierCurveTo(2,-120,28,-152,58,-152);
  gx.bezierCurveTo(88,-152,104,-110,108,-34); gx.stroke();

  /* ---- body, neck, long crocodilian skull ---- */
  gx.fillStyle=SKIN;
  gx.beginPath();
  gx.moveTo(-162,-48);                                   // snout tip
  gx.quadraticCurveTo(-154,-58,-138,-60);
  gx.lineTo(-96,-63);                                    // straight rostrum
  gx.quadraticCurveTo(-78,-70,-64,-61);                  // brow
  gx.quadraticCurveTo(-50,-52,-36,-45);                  // nape
  gx.bezierCurveTo(-10,-48, 40,-45, 82,-36);             // back under the sail
  gx.quadraticCurveTo(100,-32,110,-26);
  gx.quadraticCurveTo(94,-14,76,-10);                    // rump
  gx.lineTo(68,-6);
  gx.lineTo(76+step*8,30); gx.lineTo(57+step*8,30); gx.lineTo(52,-6);   // far leg
  gx.quadraticCurveTo(22,7,-6,3);                        // belly
  gx.lineTo(-2-step*8,30); gx.lineTo(-21-step*8,30); gx.lineTo(-25,-2); // near leg
  gx.quadraticCurveTo(-54,-12,-78,-30);                  // throat
  gx.quadraticCurveTo(-116,-41,-162,-50);                // lower jaw
  gx.closePath(); gx.fill();

  /* ---- jaws ---- */
  gx.strokeStyle=DARK; gx.lineWidth=1.5;
  gx.beginPath(); gx.moveTo(-160,-53); gx.quadraticCurveTo(-120,-48,-84,-50); gx.stroke();
  gx.fillStyle='#f2e4c6';
  for(let i=0;i<12;i++){
    const t=i/11, tx=-158+t*74, ty=-55+Math.sin(t*2.6)*2.5;
    const big=(i%3===0)?2.2:0;
    gx.beginPath(); gx.moveTo(tx,ty); gx.lineTo(tx+3.4,ty); gx.lineTo(tx+1.7,ty+7+big); gx.closePath(); gx.fill();
    gx.beginPath(); gx.moveTo(tx+1.2,ty+1); gx.lineTo(tx+4.6,ty+1); gx.lineTo(tx+2.9,ty-6-big); gx.closePath(); gx.fill();
  }
  /* narial crest, nostril, eye */
  gx.fillStyle='#3a1430';
  gx.beginPath(); gx.ellipse(-104,-66,13,5,-0.06,0,Math.PI*2); gx.fill();
  gx.fillStyle=DARK;
  gx.beginPath(); gx.ellipse(-116,-60,3.4,2.4,0,0,Math.PI*2); gx.fill();
  gx.fillStyle='#ffcf3d';
  gx.beginPath(); gx.ellipse(-60,-58,5.2,3.7,-0.2,0,Math.PI*2); gx.fill();
  gx.fillStyle=DARK;
  gx.beginPath(); gx.ellipse(-60,-58,1.9,3.4,0,0,Math.PI*2); gx.fill();

  /* ---- forelimb with the big recurved thumb claw ---- */
  gx.fillStyle=DARK;
  gx.beginPath();
  gx.moveTo(-30,-32); gx.quadraticCurveTo(-46,-18,-56,-4);
  gx.lineTo(-48,1); gx.quadraticCurveTo(-38,-14,-23,-27);
  gx.closePath(); gx.fill();
  gx.strokeStyle=DARK; gx.lineWidth=2.4;
  for(let i=0;i<3;i++){
    gx.beginPath(); gx.moveTo(-54,-1);
    gx.quadraticCurveTo(-66,4+i*4,-72,12+i*5); gx.stroke();
  }

  /* ---- clawed feet ---- */
  gx.fillStyle=DARK;
  for(const fx of [66+step*8,-11-step*8]){
    gx.beginPath();
    gx.moveTo(fx-13,30); gx.lineTo(fx+14,30); gx.lineTo(fx+19,36); gx.lineTo(fx-18,36);
    gx.closePath(); gx.fill();
    for(let i=0;i<3;i++){
      gx.beginPath(); gx.moveTo(fx-14+i*11,36); gx.lineTo(fx-19+i*11,40); gx.lineTo(fx-9+i*11,37);
      gx.closePath(); gx.fill();
    }
  }

  /* ---- sunset rim light along the top line ---- */
  gx.strokeStyle=RIM; gx.lineWidth=2.2;
  gx.beginPath();
  gx.moveTo(-160,-56); gx.quadraticCurveTo(-122,-64,-96,-66);
  gx.quadraticCurveTo(-76,-74,-62,-63); gx.stroke();
  gx.strokeStyle='rgba(255,168,92,0.32)'; gx.lineWidth=2;
  gx.beginPath();
  gx.moveTo(110,-28); gx.quadraticCurveTo(170,-24,222,-6); gx.stroke();
  gx.restore();
}

function jeep(x,y,sc,bob){
  gx.save(); gx.translate(x,y+bob); gx.scale(sc,sc);
  gx.fillStyle='#150713';
  gx.beginPath();
  gx.moveTo(-52,4); gx.lineTo(-52,-8); gx.lineTo(-34,-11);
  gx.lineTo(-25,-29); gx.lineTo(16,-29); gx.lineTo(25,-11);
  gx.lineTo(50,-8); gx.lineTo(52,4); gx.closePath(); gx.fill();
  gx.fillRect(-29,-45,3,18); gx.fillRect(21,-45,3,18); gx.fillRect(-29,-47,53,4);
  gx.fillStyle='#ffd98a';
  gx.beginPath(); gx.moveTo(-23,-27); gx.lineTo(-4,-27); gx.lineTo(-4,-13); gx.lineTo(-27,-13); gx.closePath(); gx.fill();
  gx.fillStyle='#150713';
  gx.beginPath(); gx.arc(-31,6,12,0,Math.PI*2); gx.arc(31,6,12,0,Math.PI*2); gx.fill();
  gx.fillStyle='#4a3a2a';
  gx.beginPath(); gx.arc(-31,6,4.5,0,Math.PI*2); gx.fill();
  gx.beginPath(); gx.arc(31,6,4.5,0,Math.PI*2); gx.fill();
  const bg=gx.createLinearGradient(-52,-6,-150,-6);
  bg.addColorStop(0,'rgba(255,232,160,0.55)'); bg.addColorStop(1,'rgba(255,232,160,0)');
  gx.fillStyle=bg;
  gx.beginPath(); gx.moveTo(-52,-11); gx.lineTo(-146,-34); gx.lineTo(-146,20); gx.lineTo(-52,-2); gx.closePath(); gx.fill();
  gx.restore();
}

function drawGlass(){
  glassT++;
  const sky=gx.createLinearGradient(0,0,0,HORIZON);
  sky.addColorStop(0,'#1a0d30'); sky.addColorStop(0.34,'#5d2350');
  sky.addColorStop(0.63,'#bc4340'); sky.addColorStop(0.86,'#ef8b3c'); sky.addColorStop(1,'#ffc76f');
  gx.fillStyle=sky; gx.fillRect(0,0,GW,HORIZON+2);

  const sg=gx.createRadialGradient(500,HORIZON-6,4,500,HORIZON-6,110);
  sg.addColorStop(0,'rgba(255,244,200,.95)'); sg.addColorStop(.45,'rgba(255,186,88,.55)');
  sg.addColorStop(1,'rgba(255,110,50,0)');
  gx.fillStyle=sg; gx.beginPath(); gx.arc(500,HORIZON-6,110,0,Math.PI*2); gx.fill();
  gx.fillStyle='#ffe3a4'; gx.beginPath(); gx.arc(500,HORIZON-12,36,0,Math.PI*2); gx.fill();

  gx.fillStyle='#3d1a3c';
  gx.beginPath(); gx.moveTo(0,HORIZON);
  gx.lineTo(76,106); gx.lineTo(158,132); gx.lineTo(248,86); gx.lineTo(295,106);
  gx.lineTo(356,126); gx.lineTo(444,98); gx.lineTo(515,128); gx.lineTo(617,82);
  gx.lineTo(672,108); gx.lineTo(749,124); gx.lineTo(849,92); gx.lineTo(929,126);
  gx.lineTo(GW,110); gx.lineTo(GW,HORIZON+2); gx.lineTo(0,HORIZON+2);
  gx.closePath(); gx.fill();
  gx.fillStyle='rgba(255,120,60,0.5)';
  gx.beginPath(); gx.moveTo(608,84); gx.lineTo(617,80); gx.lineTo(628,88); gx.lineTo(619,92); gx.closePath(); gx.fill();
  gx.save(); gx.globalAlpha=0.28; gx.fillStyle='#c8b0c8';
  for(let i=0;i<4;i++){
    const yy=76-i*17, xx=619+Math.sin((glassT*0.011)+i)*11;
    gx.beginPath(); gx.arc(xx,yy,5+i*3.6,0,Math.PI*2); gx.fill();
  }
  gx.restore();

  gx.fillStyle='#1d0a1e';
  for(const px of [36,964]){
    gx.save(); gx.translate(px,HORIZON+4);
    gx.beginPath(); gx.moveTo(-3,0); gx.quadraticCurveTo(-6,-44,-12,-76);
    gx.lineTo(-4,-76); gx.quadraticCurveTo(1,-44,3,0); gx.closePath(); gx.fill();
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i-2)*0.55;
      gx.beginPath(); gx.moveTo(-8,-76);
      gx.quadraticCurveTo(-8+Math.cos(a)*30,-76+Math.sin(a)*25,-8+Math.cos(a)*50,-72+Math.sin(a)*23);
      gx.quadraticCurveTo(-8+Math.cos(a)*28,-70+Math.sin(a)*18,-8,-72); gx.closePath(); gx.fill();
    }
    gx.restore();
  }

  const gg=gx.createLinearGradient(0,HORIZON,0,GH);
  gg.addColorStop(0,'#6b3520'); gg.addColorStop(1,'#25100e');
  gx.fillStyle=gg; gx.fillRect(0,HORIZON,GW,GH-HORIZON);
  gx.strokeStyle='rgba(255,170,90,0.18)'; gx.lineWidth=1;
  for(let i=0;i<9;i++){
    const yy=HORIZON+5+i*6;
    gx.beginPath(); gx.moveTo(0,yy); gx.lineTo(GW,yy); gx.stroke();
  }

  if(glassT%3===0){
    gdust.push({x:322+Math.random()*20,y:HORIZON+16+Math.random()*8,r:3+Math.random()*5,life:64});
    if(glassT%7===0) gdust.push({x:636+Math.random()*28,y:HORIZON+18+Math.random()*9,r:4+Math.random()*8,life:56});
  }
  for(let i=gdust.length-1;i>=0;i--){
    const d=gdust[i]; d.x+=0.8; d.y-=0.18; d.r+=0.16; d.life--;
    if(d.life<=0){ gdust.splice(i,1); continue; }
    gx.globalAlpha=(d.life/64)*0.42; gx.fillStyle='#e9b98a';
    gx.beginPath(); gx.arc(d.x,d.y,d.r,0,Math.PI*2); gx.fill();
  }
  gx.globalAlpha=1;

  jeep(286,HORIZON+22,1.02,Math.sin(glassT*0.16)*1.4);
  spino(682,HORIZON+18,1.02,Math.sin(glassT*0.15));

  gx.strokeStyle='rgba(255,215,150,0.22)'; gx.lineWidth=2;
  for(let i=0;i<5;i++){
    const yy=HORIZON-18-i*15, off=(glassT*3+i*47)%260;
    gx.beginPath(); gx.moveTo(858-off,yy); gx.lineTo(936-off,yy); gx.stroke();
  }

  const sh=gx.createLinearGradient(0,0,GW,GH);
  sh.addColorStop(0,'rgba(255,255,255,0.10)'); sh.addColorStop(0.42,'rgba(255,255,255,0)');
  gx.fillStyle=sh; gx.fillRect(0,0,GW,GH);
  const vg=gx.createRadialGradient(GW/2,GH/2,GH*0.35,GW/2,GH/2,GW*0.62);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  gx.fillStyle=vg; gx.fillRect(0,0,GW,GH);
}

function fitCab(){
  const f=document.getElementById('fit'), cab=f.firstElementChild;
  cab.classList.remove('compact');
  f.style.transform='none';
  const fit=function(){
    return Math.min(1,(window.innerHeight-18)/f.offsetHeight,
                      (window.innerWidth-18)/f.offsetWidth);
  };
  let sc=fit();
  if(sc<0.86){ cab.classList.add('compact'); sc=fit(); }
  f.style.transform='scale('+sc+')';
}
addEventListener('resize',fitCab);

const clearBtn=document.getElementById('clear');
let clearArmed=0;
clearBtn.addEventListener('click',function(){
  clearBtn.blur();                       // keep the arrow keys on the table
  if(!hi.length){
    clearBtn.textContent='NO SCORES YET';
    setTimeout(function(){ clearBtn.textContent='CLEAR HIGH SCORES'; },1200);
    return;
  }
  if(!clearArmed){
    clearArmed=1;
    clearBtn.textContent='CLICK AGAIN TO ERASE';
    setTimeout(function(){
      if(clearArmed){ clearArmed=0; clearBtn.textContent='CLEAR HIGH SCORES'; }
    },3000);
    return;
  }
  clearArmed=0; hi=[]; justIdx=-1; saveHi();
  clearBtn.classList.add('done');
  clearBtn.textContent='SCORES CLEARED';
  blip(300,0.2,'square',0.06,900);
  setTimeout(function(){
    clearBtn.classList.remove('done');
    clearBtn.textContent='CLEAR HIGH SCORES';
  },1400);
});

function loop(){ step(); draw(); if(gl.offsetParent) drawGlass(); requestAnimationFrame(loop); }
msgEl.textContent=HINT;
paintLetters();
fitCab();
loop();
</script>
</body>
</html>
